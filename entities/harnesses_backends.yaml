    lifecycle: mature
    decay_class: stable
    last_verified: "2026-11-26"
    license: MIT
    urls: { primary: "https://github.com/ggml-org/llama.cpp" }
    proof:
      - "Universal CUDA/Metal/Vulkan/ROCm engine with --n-cpu-moe hybrid offload, --lora hot-loading, and --load-mode"
    gotchas:
      - "--no-mmap is deprecated (migrate to --load-mode none); add -cuda graphs=0 if partial MoE offload outputs gibberish."

  - id: ik-llama-cpp
