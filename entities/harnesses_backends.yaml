    lifecycle: operational
    decay_class: operational
    last_verified: "2026-11-26"
    license: MIT
    urls: { primary: "https://github.com/ikawrakow/ik_llama.cpp" }
    proof:
      - "Leads bleeding-edge kernels: FlashMLA, IQK AVX-512 (HAVE_FANCY_SIMD), Trellis IQ2_KS/IQ3_KT quants"
    gotchas:
      - "CPU + NVIDIA CUDA only; avoid -rtr on k-quants with MoE offload."

  - id: wangp-v20
    kind: tool
    domain: backend
    name: "WanGP v20.12 + MMGP v4 + SageGP 1.0.2"
