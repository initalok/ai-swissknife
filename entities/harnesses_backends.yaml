entities:
  - id: pi
    kind: harness
    domain: harness
    name: "Pi Coding Agent (Building-Block Kernel)"
    lifecycle: mature
    decay_class: stable
    last_verified: "2026-11-26"
    license: MIT
    urls: { primary: "https://pi.dev/" }
    proof:
      - "Minimalist TUI/RPC/SDK kernel with /tree DAG branching and built-in MCP + Codemode JS sandbox"
      - "Highest-scoring HF Harness Adapter target (64.7% SWE-Pro hard-51) and Inkling 2 Mini reference harness"
    gotchas:
      - "Intentionally omits built-in per-tool approval gates; pair with safeagents or OS sandboxes."

  - id: pi-durable
    kind: harness
    domain: harness
    name: "Pi Durable (SQLite Crash-Resumable Runtime)"
    lifecycle: operational
    decay_class: operational
    last_verified: "2026-11-26"
    license: MIT
    urls: { primary: "https://github.com/disler/durable-pi" }
    proof:
      - "SQLite/JSONL crash-resumable agent network, atomic shared app state, background compaction (200K/250K), live tool hot-swap"
    gotchas:
      - "Adds daemon state management overhead; use plain Pi for quick one-off terminal edits."

  - id: deepseek-harness
    kind: harness
    domain: harness
    name: "DeepSeek Harness (dsh / Cordis Platform)"
    lifecycle: experimental
    decay_class: volatile
    last_verified: "2026-11-26"
    license: MIT
    urls: { primary: "https://github.com/deepseek-ai/deepseek-harness" }
    proof:
      - "Cordis everything-is-a-plugin architecture letting you replace the agent loop itself, Creator Mode, built-in read-only sandbox"
      - "First-party plugins orchestrate Claude Code & Codex as sub-agents; supports local OpenAI-compat servers"
    gotchas:
      - "Rapidly iterating developer preview (0.2.3-alpha.2); pin plugin versions against breaking API changes."

  - id: hermes-agent
    kind: harness
    domain: harness
    name: "Hermes Agent (v0.23.4 Self-Improving Daemon)"
    lifecycle: operational
    decay_class: operational
    last_verified: "2026-11-26"
    license: MIT
    urls: { primary: "https://github.com/NousResearch/hermes-agent" }
    proof:
      - "#1 globally on OpenRouter token volume; persistent memory, autonomous skill creation, Telegram/cron/ACP, 40+ tools"
      - "Official HF Harness Adapter target (Qwen3.8-27B-hermes-adapted)"
    gotchas:
      - "Does not auto-compact aggressively like Pi by default; cap thinking/context tokens on giant repos."

  - id: antigravity
    kind: harness
    domain: harness
    name: "Google Antigravity (2.0 Desktop, CLI & SDK)"
    lifecycle: operational
    decay_class: operational
    last_verified: "2026-11-26"
    license: Proprietary
    urls: { primary: "https://aistudio.google.com/" }
    proof:
      - "Unified GUI+CLI harness running Gemini 4 Hydrogen (Everyday/Thinking + Task mode), 3.8 Flash, & 4 Argon/Carbon/Neon"
    gotchas:
      - "Tied to Google auth/billing for paid frontier nodes; configure local fallback for offline sessions."

  - id: zed-acp
    kind: harness
    domain: harness
    name: "Zed Editor + ACP Registry"
    lifecycle: mature
    decay_class: stable
    last_verified: "2026-11-26"
    license: Apache-2.0
    urls: { primary: "https://zed.dev/" }
    proof:
      - "Unifies Pi, Claude Agent, Codex, Gemini CLI, OpenCode, and Cursor inside one native multi-file diff UI with zero telemetry"
    gotchas:
      - "Requires ACP-compatible agent binary installed locally."

  - id: opencode
    kind: harness
    domain: harness
    name: "OpenCode CLI"
    lifecycle: mature
    decay_class: stable
    last_verified: "2026-11-26"
    license: MIT
    urls: { primary: "https://github.com/anomalyco/opencode" }
    proof:
      - "Vendor-agnostic terminal coding agent with official HF Qwen3.8-27B-opencode-adapted LoRA"
    gotchas:
      - "Does not auto-compact as aggressively as Pi; watch context length on multi-hour repos."

  - id: safeagents
    kind: tool
    domain: safety-protocol
    name: "Hugging Face safeagents Runtime Proxy"
    lifecycle: operational
    decay_class: operational
    last_verified: "2026-11-26"
    license: Apache-2.0
    urls: { primary: "https://github.com/huggingface/safeagents" }
    proof:
      - "Transparent OpenAI/Anthropic proxy with atif-scan (10-20ms on Apple Silicon) & Decision Model judge"
      - "Audited 1.3M tool calls and blocked 647 suspicious calls during HF harness-adapter RL training"
    gotchas:
      - "Configure domain plugins (e.g. hf://harness-hub/qwen-safeagents-plugin) rather than running empty defaults."

  - id: progressive-skills
    kind: tool
    domain: safety-protocol
    name: "Progressive Skills (SKILL.md) & AGENTS.md"
    lifecycle: mature
    decay_class: stable
    last_verified: "2026-11-26"
    license: Open-Standard
    urls: { primary: "https://agents.md/" }
    proof:
      - "Loads tool instructions on demand to preserve KV prompt cache instead of dumping 30+ MCP schemas upfront"
    gotchas:
      - "Keep AGENTS.md under 500 tokens; offload heavy domain instructions into on-demand SKILL.md modules."

  - id: context-archival
    kind: tool
    domain: safety-protocol
    name: "Retrieval Context Archival (vs Lossy Summaries)"
    lifecycle: operational
    decay_class: operational
    last_verified: "2026-11-26"
    license: Open-Pattern
    urls: { primary: "https://github.com/unslothai/unsloth" }
    proof:
      - "Archives old turns to searchable SQLite/vector history at 200K tokens instead of destructive summarization"
    gotchas:
      - "Pair with Laya + all-MiniLM-L6-v2 (23 MB) if you need auditable fact-invalidation ledgers."

  - id: unsloth-runtime
    kind: tool
    domain: backend
    name: "Unsloth Runtime & Studio (v0.1.923-beta)"
    lifecycle: operational
    decay_class: operational
    last_verified: "2026-11-26"
    license: Apache-2.0
    urls: { primary: "https://github.com/unslothai/unsloth" }
    proof:
      - "1.9x faster Inkling 2 Mini, 3x faster VRAM-exceeding MoE GGUFs, 4.1x faster Laya, AMD NPU, Bwrap/Seatbelt/MXC sandboxes"
    gotchas:
      - "Mandatory runtime for Unsloth's looped-layer Inkling 2 Mini GGUFs and Anthropic-endpoint local Claude Code routing."

  - id: llama-cpp
    kind: tool
    domain: backend
