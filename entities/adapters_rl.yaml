  - id: openenv-asyncgrpo
    kind: tool
    domain: adaptation
    name: "OpenEnv + Harbor + TRL AsyncGRPOTrainer"
    lifecycle: operational
    decay_class: operational
    last_verified: "2026-11-26"
    license: Apache-2.0
    urls: { primary: "https://huggingface.co/blog/harness-adapters-at-scale" }
    proof:
      - "Proxy-based in-harness RL inside unmodified shipping harnesses (2xB200; 1.2x-2.3x more task groups/step as trajectories shrink)"
      - "openenv validate passed 858/1,127 tasks; base-model difficulty filter lifted step-50 reward to 0.81 vs 0.63"
    gotchas:
      - "Use all-linear LoRA, LR 2e-5 (1e-4 collapses rollouts), tool bonus 0.1, and never train GRPO on all-pass/all-fail tasks."

