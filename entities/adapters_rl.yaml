entities:
  - id: qwen38-27b-super-adapter
    kind: adapter
    domain: adaptation
    name: "Qwen3.8-27B Super-Adapter (Rank-96 PEFT Cat)"
    lifecycle: mature
    decay_class: stable
    last_verified: "2026-11-26"
    base_ref: qwen3.8-27b
    compatible_harnesses: [pi, hermes-agent, opencode]
    license: Apache-2.0
    hardware: { zone: zone1-16gb-vram, vram_delta_mb: 912 }
    urls:
      primary: "https://huggingface.co/harness-hub/Qwen3.8-27B-super-adapter"
      source: "https://huggingface.co/blog/harness-adapters-at-scale"
    proof:
      - "Zero-retraining orthogonal rank-96 merge (wt 0.5) of pi, Hermes, and OpenCode LoRAs"
      - "Thinking Off: beats base 6/6 pairs (39.5% -> 49.0%, 53-73% fewer calls); Thinking On: wins 5/6 & ties 1 (55.5% -> 63.5%)"
    launch_recipe: "llama-server -m Qwen3.8-27B-IQ4_XS.gguf --lora Qwen3.8-27B-super-adapter-F16.gguf -ngl 99 -fa on -c 65536 -ctk q8_0 -ctv q8_0"
    gotchas:
      - "If using a single harness with thinking off, prefer its specialist LoRA; mild pre-tool reasoning leakage occurs (arXiv:2610.14270)."

  - id: qwen38-27b-pi-adapted
    kind: adapter
    domain: adaptation
    name: "Qwen3.8-27B-pi-adapted (Specialist LoRA)"
    lifecycle: mature
    decay_class: stable
    last_verified: "2026-11-26"
    base_ref: qwen3.8-27b
    compatible_harnesses: [pi]
    license: Apache-2.0
    hardware: { zone: zone1-16gb-vram, vram_delta_mb: 304 }
    urls: { primary: "https://huggingface.co/collections/harness-hub/qwen38-27b-harness-adapters" }
    proof:
      - "Lifts SWE-bench Pro hard-51 from 39.2% -> 64.7% and Terminal-Bench 2.1 by +16.3 pts with 56-72% fewer tool calls"
      - "Transfers cleanly across harnesses to OpenCode (44.8% -> 54.0%) and Hermes (46.3% -> 56.1%)"
    launch_recipe: "llama-server -m Qwen3.8-27B-IQ4_XS.gguf --lora Qwen3.8-27B-pi-lora-F16.gguf --chat-template-kwargs '{\"enable_thinking\": false}' -ngl 99 -fa on -c 65536 -ctk q8_0 -ctv q8_0"
    gotchas:
      - "Trained on BF16 weights with thinking off; validate GGUF quant fidelity locally."

  - id: qwen38-27b-hermes-adapted
    kind: adapter
    domain: adaptation
    name: "Qwen3.8-27B-hermes-adapted (Specialist LoRA)"
    lifecycle: mature
    decay_class: stable
    last_verified: "2026-11-26"
    base_ref: qwen3.8-27b
    compatible_harnesses: [hermes-agent]
    license: Apache-2.0
    hardware: { zone: zone1-16gb-vram, vram_delta_mb: 304 }
    urls: { primary: "https://huggingface.co/collections/harness-hub/qwen38-27b-harness-adapters" }
    proof:
      - "Lifts Hermes SWE-Pro hard-51 from 29.4% -> 43.1% and Terminal-Bench 2.1 by +14.1 pts with 56-70% fewer calls"
    gotchas:
      - "Shows slight OOD dip on AutomationBench (17.7% vs 23.0% base); use super-adapter for general tasks."

  - id: qwen38-27b-opencode-adapted
    kind: adapter
