forage_routes:
  coding-agent:
    description: "Autonomous Coding & Terminal CLI (~20K tok/step)"
    chain: [google-ai-studio, zhipu-bigmodel, openrouter-free, nvidia-nim, unsloth-local-api, pollinations]
  repo-1m:
    description: "Massive Repo / Multi-PDF Ingestion (100K-1M tok)"
    chain: [google-ai-studio, zhipu-bigmodel, unsloth-local-api]
  deep-reason:
    description: "Frontier Logic, Math & Architecture"
    chain: [nvidia-nim, google-ai-studio, openrouter-free, unsloth-local-api, pollinations]
  fast-json:
    description: "Fast Small-Prompt Classification & Schema Output (<6K tok)"
    chain: [groq-cloud, google-ai-studio, cloudflare-workers-ai, unsloth-local-api, pollinations]
  decision-gate:
    description: "System-1 Non-Autoregressive Decisions, Extraction & Safety Gates"
    chain: [google-ai-studio, cloudflare-workers-ai, unsloth-local-api]
  voice-stt:
    description: "Real-Time Audio Transcription (Whisper-Large-v3)"
    chain: [groq-cloud]

entities:
  - id: google-ai-studio
    kind: gateway
    domain: cloud
    name: "Google AI Studio (Gemini 4 Hydrogen & 3.8 Flash)"
    lifecycle: operational
    decay_class: volatile
    last_verified: "2026-11-26"
    tier: tier2-cloud-free
    env_key: GEMINI_API_KEY
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    default_model: "gemini-3.8-flash"
    quota: "No Card: Free per-project (4 Hydrogen, 3.8 Flash 1M ctx) + Decision 1 (200 RPM / 10K RPD)"
    urls: { primary: "https://aistudio.google.com/" }
    proof:
      - "Gemini 4 Hydrogen (Everyday & Thinking) launched Nov 2026 across Free, Plus, Pro & Ultra"
      - "Gemini Decision 1 evaluates up to 1,000 typed questions per prefill pass with zero output tokens"
    gotchas:
      - "Gemini 2.5 retires Dec 1, 2026; 4 Argon/Carbon/Neon, Batch, and Search Grounding are paid-only."
      - "Free tier prompts may be logged outside EU/UK/CH; redact sensitive PII."

  - id: zhipu-bigmodel
    kind: gateway
    domain: cloud
    name: "Z.ai BigModel (GLM-4.7-Flash)"
    lifecycle: operational
    decay_class: volatile
    last_verified: "2026-11-26"
    tier: tier2-cloud-free
    env_key: ZHIPU_API_KEY
    base_url: "https://open.bigmodel.cn/api/paas/v4/"
    default_model: "glm-4.7-flash"
    quota: "No Card: Completely Free Flash tier (200K ctx / 128K out)"
    urls: { primary: "https://open.bigmodel.cn/" }
    proof:
      - "GLM-4.7-Flash (MIT) scores 79.5 tau2-Bench with 200K context window"
    gotchas:
      - "Only glm-4.7-flash is permanently free; the GLM-5.x line is billed and fails on $0 balances."

  - id: nvidia-nim
    kind: gateway
    domain: cloud
    name: "NVIDIA NIM Developer Catalog"
    lifecycle: operational
    decay_class: volatile
    last_verified: "2026-11-26"
    tier: tier2-cloud-free
    env_key: NVIDIA_API_KEY
    base_url: "https://integrate.api.nvidia.com/v1"
    default_model: "deepseek-ai/deepseek-v4.1-flash"
    quota: "No Card: ~40 RPM Developer Prototyping Catalog"
    urls: { primary: "https://build.nvidia.com/" }
    proof:
      - "Hosts 552B DeepSeek-V4.1-Flash, Nemotron-3.5-Super-VL, and Nemotron-3-Ultra serverless"
    gotchas:
      - "Prototyping-only license with occasional cold-start queues on giant MoEs."

  - id: openrouter-free
    kind: gateway
    domain: cloud
    name: "OpenRouter (:free)"
    lifecycle: operational
    decay_class: volatile
    last_verified: "2026-11-26"
    tier: tier2-cloud-free
    env_key: OPENROUTER_API_KEY
    base_url: "https://openrouter.ai/api/v1"
    default_model: "openrouter/free"
    quota: "20 RPM, 50 RPD ($0) -> 1,000 RPD (>=10 credits balance)"
    urls: { primary: "https://openrouter.ai/" }
    proof:
      - "Aggregates free frontier hosts; also offers Inkling 2 Mini via io.net at $0.08/M in, $0.35/M out"
    gotchas:
      - "Negative account balance returns HTTP 402 even on :free endpoints; poll GET /api/v1/key."

  - id: groq-cloud
    kind: gateway
    domain: cloud
    name: "Groq Cloud LPU"
    lifecycle: operational
    decay_class: volatile
    last_verified: "2026-11-26"
    tier: tier2-cloud-free
    env_key: GROQ_API_KEY
    base_url: "https://api.groq.com/openai/v1"
    default_model: "qwen/qwen3.8-27b"
    quota: "No Card: LLMs 30 RPM / 1K RPD / 8K TPM; Whisper 2K RPD / 28.8K sec/day"
    urls: { primary: "https://console.groq.com/" }
    proof:
      - "Verified active free LLMs: qwen/qwen3.8-27b, gpt-oss-120b, gpt-oss-20b, and Whisper-Large-v3/Turbo"
    gotchas:
      - "Strict 8,000 TPM wall on free LLMs causes 429s on coding agents; keep prompts under 6K tokens or use for STT."
      - "Llama 3.1/3.3 models moved to Contact Sales."

  - id: cloudflare-workers-ai
    kind: gateway
    domain: cloud
    name: "Cloudflare Workers AI (Clef & Clairic)"
    lifecycle: operational
    decay_class: volatile
    last_verified: "2026-11-26"
    tier: tier2-cloud-free
    env_key: CLOUDFLARE_API_TOKEN
    base_url: "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/ai/v1"
    default_model: "@cf/cloudflare/clef"
    quota: "No Card: 10,000 Neurons/day free (resets 00:00 UTC)"
    urls: { primary: "https://developers.cloudflare.com/workers-ai/" }
    proof:
      - "Non-autoregressive Clef, Clef-Omni (audio/video), and Clairic (typed span extraction & 64-step forecasts)"
    gotchas:
      - "Legacy Workers AI catalog models were hard-retired Nov 20, 2026 (HTTP 410)."

  - id: unsloth-local-api
    kind: gateway
    domain: cloud
    name: "Local Unsloth / llama-server Loopback"
    lifecycle: mature
    decay_class: stable
    last_verified: "2026-11-26"
    tier: tier1-local
    env_key: null
    base_url: "http://localhost:8000/v1"
    default_model: "qwen3.8-27b"
    quota: "Unlimited Local Hardware (16GB VRAM + 64GB RAM; OpenAI & Anthropic APIs)"
    urls: { primary: "https://github.com/unslothai/unsloth" }
    proof:
      - "100% air-gapped zero-retention local inference fallback"
    gotchas:
      - "Must be running locally on port 8000 before cloud foraging auto-detects it."

  - id: pollinations
    kind: gateway
    domain: cloud
    name: "Pollinations AI"
    lifecycle: operational
    decay_class: stable
    last_verified: "2026-11-26"
    tier: tier0-keyless
    env_key: null
    base_url: "https://text.pollinations.ai/openai"
    default_model: "openai"
    quota: "Keyless Zero-Auth Fair-Use IP Quota (Text, FLUX Image, Audio)"
    urls: { primary: "https://pollinations.ai/" }
    proof:
      - "Instant zero-key fallback for sandbox chat and FLUX REST images"
    gotchas:
      - "Shared public community endpoint; never transmit credentials or sensitive data."

  - id: firecrawl
    kind: tool
    domain: grounding
    name: "Firecrawl (Keyless Skill & API)"
    lifecycle: operational
    decay_class: operational
    last_verified: "2026-11-26"
    quota: "Keyless onboarding skill + 500 credits on signup"
    urls: { primary: "https://www.firecrawl.dev/" }
    proof:
      - "Lowest web-scraping token bloat on OpenBenchmarks (7,456 median tokens/task)"
    gotchas:
      - "Keyless mode is IP-rate-limited; pass API key for burst crawls."

  - id: jina-reader
    kind: tool
    domain: grounding
    name: "Jina Reader (r.jina.ai / s.jina.ai)"
    lifecycle: mature
    decay_class: stable
    last_verified: "2026-11-26"
    quota: "Keyless prefix + 10M free tokens with API key"
    urls: { primary: "https://jina.ai/reader/" }
    proof:
      - "Zero-SDK URL/PDF-to-Markdown conversion and keyless search prefix"
    gotchas:
      - "Rate-limited without API key on high-frequency batch loops."

  - id: exa-search
    kind: tool
    domain: grounding
    name: "Exa 3.0 Neural Search"
    lifecycle: operational
    decay_class: volatile
    last_verified: "2026-11-26"
    quota: "No Card: $10/mo recurring credits + $10 bonus (10 QPS search / 100 QPS contents)"
    urls: { primary: "https://exa.ai/" }
    proof:
      - "Resets 1st of every month (~2,500 Lite searches) with 50 concurrent agent runs"
    gotchas:
      - "Deep research mode burns monthly credits faster than Lite mode."

  - id: tavily-search
    kind: tool
    domain: grounding
    name: "Tavily Search API"
    lifecycle: operational
    decay_class: operational
    last_verified: "2026-11-26"
    quota: "No Card: 1,000 credits/month forever + Hermes keyless mode"
    urls: { primary: "https://tavily.com/" }
    proof:
      - "Returns pre-chunked, relevance-scored RAG snippets ready for prompt injection"
    gotchas:
      - "Advanced search depth consumes 2 credits per call vs 1 for basic."

  - id: cohere-embed-rerank
    kind: tool
    domain: grounding
    name: "Cohere Embed 5 & Rerank 5"
    lifecycle: operational
    decay_class: operational
    last_verified: "2026-11-26"
    quota: "No Card: 1,000 calls/month Trial Key (10 Rerank/min)"
    urls: { primary: "https://cohere.com/" }
    proof:
      - "Shared Pro/Fast embedding space (98.4% retention) + 32K context JSON/YAML Rerank 5"
    gotchas:
      - "Trial keys are restricted to non-commercial evaluation rates."

  - id: openalex-arxiv
    kind: tool
    domain: grounding
    name: "OpenAlex + arXiv API"
    lifecycle: mature
    decay_class: stable
    last_verified: "2026-11-26"
    quota: "Keyless: 100,000 requests/day forever"
    urls: { primary: "https://openalex.org/" }
    proof:
      - "250M+ scholarly works, citation graphs, and open-access PDFs"
    gotchas:
      - "Pass ?mailto=you@domain.com in OpenAlex URLs to enter the fast polite pool."
