sections:
  - heading: "1. Harnessed Agentic RL & Super-Adapter Stack"
    headers: ["Component / Artifact", "Primary Source & Stack", "Verified Performance & Efficiency", "Key Caveat & Tuning Rule"]
    rows:
      - c1: "**In-Harness RL Pipeline**<br><sub>Unmodified shipping harness</sub>"
        c2: "[HF Harness Adapters](https://huggingface.co/blog/harness-adapters-at-scale)<br><sub>`OpenEnv` · `Harbor` · `TRL AsyncGRPO` · `Agent Lightning` (`2608.17528`)</sub>"
        c3: "Token/logprob capture proxy between `Pi 1.5.2` / `OpenCode 2.2.7` / `Hermes v0.22.6` and vLLM (2×B200); `pi` lifts SWE-Pro hard-51 **39.2%→64.7%** (**56–72%** fewer tool calls)."
        c4: "⚠️ Use `all-linear` LoRA, LR **`2e-5`** (`1e-4` collapses rollouts), tool bonus `0.1`, repo-family interleaving, & maxed `--token-budget` (**1.2×–2.3×** groups/step)."
      - c1: "**Task Filtering & Validation**<br><sub>Data quality over raw volume</sub>"
        c2: "`Repo2RLEnv` (`Tasksmith`) +<br><sub>`SWE-smith` · `TaskTrove` · `termgrade` (`871` tasks)</sub>"
        c3: "`openenv validate` passed **858/1,127** Hub tasks; base-model difficulty check kept **171/442** (*solved sometimes*), lifting step-50 GRPO reward to **0.81** vs **0.63**."
        c4: "✅ Always run `oracle_max`, `floor_gap`, `canary_floor`, & `episode_determinism`—caught broken verifiers including `regex-log`."
      - c1: "**Orthogonal Rank-96 Super-Adapter**<br><sub>Zero-retraining multi-harness merge</sub>"
        c2: "`harness-hub/Qwen3.8-27B-super-adapter`<br><sub>`PEFT cat` · `Task Arithmetic` (`2212.04089`) · `TIES` (`2306.01708`) · `KnOTS` (`2410.19735`)</sub>"
        c3: "Cosine sim `~0.01–0.02` enables rank-96 concat at weight **`½`**: beats base on **6/6** pairs thinking off (**39.5%→49.0%**) & **5/6** thinking on (**55.5%→63.5%**)."
        c4: "⚠️ Weight `1` over-applies updates; pick specialist LoRA if thinking off on one harness; OOD `AutomationBench` stays near base noise (`23.7%` vs `23.0%`)."
      - c1: "**Thinking Leakage & Transfer**<br><sub>Cross-harness & hybrid behavior</sub>"
        c2: "`arXiv:2610.14270` ·<br><sub>`harness-adapters-trajectories` bucket</sub>"
        c3: "`pi` adapter transfers cleanly to OpenCode (**44.8%→54.0%**) & Hermes (**46.3%→56.1%**) w/ ~45% fewer tool calls; community reports compatibility w/ `Swift-1.5`."
        c4: "⚠️ Non-thinking RL induces short pre-tool reasoning traces (*thinking leakage*)—stays net-positive under fixed token budgets."

  - heading: "2. Frontier Research & Underground Playbooks"
    headers: ["Lead / Playbook", "Primary Source", "Why It Matters Right Now", "How to Experiment Today"]
    rows:
      - c1: "**Gradient-Free Self-Rewriting**<br><sub>Weight Editing via Reasoning</sub>"
        c2: "UIUC (`arXiv:2611.21885`)<br><sub>Published Nov 16–20, 2026</sub>"
        c3: "Demonstrates an LLM diagnosing failures via pure reasoning and rewriting its own weights across sessions with **zero gradients or training runs**."
        c4: "🔬 Track for persistent local agents that permanently patch recurring coding mistakes."
      - c1: "**Variable-Loop Test-Time Compute**<br><sub>Dynamic Depth per Token</sub>"
        c2: "`thinkingmachines/TML-d24-varloop-research`"
        c3: "Companion to `Inkling 2 Mini` allowing you to dial `loop_num_passes` at inference time—trading latency for reasoning depth without swapping models."
        c4: "🧪 Pair with a `Laya` complexity router to run easy queries in 1 loop and hard bugs in 3+ loops."
      - c1: "**Playable Worlds + Auto-Directed Video**<br><sub>`Hy-Nomas` + `Deepy Apps`</sub>"
        c2: "`Tencent-Hunyuan/Hy-Nomas`<br>`WanGP v20.12 Deepy Apps`"
        c3: "Generates WASD-navigable interactive worlds on 1 GPU (`Hy-Nomas`) and packages generated video/audio assets into playable 3D `.wgpapp` scenes (`Deepy Apps`)."
        c4: "🎬 Wire Antigravity or Claude Code into `Deepy Prime` via MCP to auto-direct, inspect frames, and iterate."
      - c1: "**Zero-Cost Local Claude Code Loop**<br><sub>Anthropic Proxy + Decision Gate</sub>"
        c2: "Unsloth Anthropic API +<br>`safeagents` + `Laya` (`localhost:8888`)"
        c3: "Point `Claude Code` or `OpenCode` to local `Inkling 2 Mini` / `Qwen3.8-27B-super-adapter` while gating shell calls through `safeagents` + `Laya`."
        c4: "🛡️ Cap output tokens/turns on `Inkling 2 Mini` to prevent repetitive debug loops."

drawers:
