id: "06-adaptation"
number: "06"
title: "Chapter 06 · Harness Adapters, In-Harness RL & Frontier Research"
short_title: "Ch 06: Harness Adapters & RL"
output_file: "book/06-adaptation-frontier.md"
part: "PART II: THE ENGINE ROOM"
verdict: >-
  Instead of chasing giant base models, freeze one strong 27B backbone and train lightweight RL LoRA adapters directly inside your unmodified shipping harness—
  cutting tool calls by 53–73% while gaining +13 to +25 points, and merging orthogonal adapters at rank 96 with zero retraining.
read_if: "You want to serve hot-swappable per-harness LoRAs, reproduce Hugging Face's in-harness RL recipe, or track self-improving LLM research."

mermaid: |
  flowchart LR
      SRC["1. Task Pipeline<br/>SWE-smith · TaskTrove · Tasksmith (Repo2RLEnv)"] --> VAL["2. openenv validate<br/>oracle_max · floor_gap · determinism (858/1,127)"]
      VAL --> DIFF["3. Difficulty Filter<br/>Base solves sometimes (171/442 -> 0.81 vs 0.63)"]
      DIFF --> LOOP["4. In-Harness AsyncGRPO<br/>Unmodified Pi/OpenCode/Hermes + safeagents Proxy"]
      LOOP --> SERVE["5. One Frozen Base -> Many LoRAs<br/>Specialist (Thinking Off) OR Rank-96 Cat Super-Adapter (Thinking On)"]

sections:
  - heading: "1. Harness Adapters Architecture & Full Hugging Face RL Recipe"
    headers: ["Stage / Component", "Primary Artifacts & Papers", "Verified Numbers & Mechanics", "Critical Caveat & Selection Rule"]
    rows:
      - c1: "**In-Harness Proxy RL**<br><sub>No re-implemented agent loops</sub>"
        c2: "[HF Harness Adapters](https://huggingface.co/blog/harness-adapters-at-scale)<br><sub>`OpenEnv` · `Harbor` · `TRL AsyncGRPO` · `Agent Lightning` (`2608.17528`)</sub>"
        c3: "Token/logprob capture proxy sits between unmodified `Pi 1.5.2` / `OpenCode 2.2.7` / `Hermes v0.22.6` and vLLM (2×B200; 598 steps / 167M tokens). `pi` lifts SWE-Pro hard-51 **39.2%→64.7%** (**56–72%** fewer calls)."
        c4: "⚠️ Use `all-linear` LoRA, LR **`2e-5`** (`1e-4` collapses rollouts), tool bonus `0.1`, repo-family interleaving, & maxed `--token-budget` (**1.2×–2.3×** groups/step)."
      - c1: "**Data Validation & Difficulty Gate**<br><sub>Quality beats raw task volume</sub>"
        c2: "`harness-hub/agentic-coding-envs`<br><sub>`SWE-smith` (717) · `TaskTrove` (130) · `Tasksmith`/`Repo2RLEnv` (24) + `termgrade` (300)</sub>"
        c3: "`openenv validate` (`oracle_max`, `floor_gap`, `canary_floor`, `episode_determinism`) passed **858/1,127** tasks; difficulty check kept **171/442** (*solved sometimes*), lifting step-50 reward to **0.81** vs **0.63**."
        c4: "✅ Caught broken verifiers including `regex-log` on TB2.1. Never train GRPO on all-pass or all-fail tasks (zero advantage signal)."
      - c1: "**Specialist vs. Rank-96 Super-Adapter**<br><sub>Orthogonal LoRA merging</sub>"
        c2: "`harness-hub/Qwen3.8-27B-super-adapter`<br><sub>`PEFT cat` (`3×32=96`) · `2212.04089` · `2306.01708` · `2410.19735`</sub>"
        c3: "Adapters have `~0.01–0.02` cosine similarity. Merging at weight **`½`** beats base on **6/6** pairs thinking off (**39.5%→49.0%**) and **5/6** thinking on (**55.5%→63.5%**, **31–48%** fewer SWE-Pro calls)."
        c4: "✅ **Rule:** Single harness + thinking off → **Specialist** (`pi` **64.0%** vs **46.0%**). Thinking on (`xhigh`) or multi-harness fleet → **Super-Adapter**."
      - c1: "**Transfer, Leakage & Safety**<br><sub>Cross-harness + `safeagents`</sub>"
        c2: "`arXiv:2610.14270` (Thinking Leakage)<br>`harness-hub/qwen-safeagents-plugin`"
        c3: "`pi` LoRA transfers to OpenCode (**44.8%→54.0%**) & Hermes (**46.3%→56.1%**); community confirmed transfer to `Swift-1.5` & proposed **MOPD**. `safeagents` checked **1.3M** calls & blocked **647**."
        c4: "⚠️ Non-thinking RL induces short pre-tool *thinking leakage* (net-positive under fixed budgets); OOD `AutomationBench` stays near base noise (`23.7%` vs `23.0%`)."

  - heading: "2. Frontier Self-Improvement & Test-Time Compute Leads"
    headers: ["Research Lead", "Primary Source", "Why It Matters for Local & Agents", "How to Track / Experiment"]
    rows:
      - c1: "**Gradient-Free Self-Rewriting**<br><sub>Weight Editing via Reasoning</sub>"
        c2: "UIUC (`arXiv:2611.21885`)<br><sub>Nov 16–20, 2026</sub>"
        c3: "Demonstrates an LLM diagnosing failures via pure reasoning and rewriting its own weights across sessions with **zero gradients or training runs**."
        c4: "🔬 Watch for persistent local agents that permanently patch recurring coding mistakes without RL clusters."
      - c1: "**Variable-Loop Test-Time Compute**<br><sub>Dynamic Layer Depth per Token</sub>"
        c2: "`thinkingmachines/TML-d24-varloop-research`"
        c3: "Companion to `Inkling 2 Mini` allowing inference-time `loop_num_passes` control—trading latency for depth without swapping checkpoints."
        c4: "🧪 Pair with a `Laya` System-1 router: 1 loop for trivial edits, 3+ loops for hard bugs."
      - c1: "**Multi-Teacher On-Policy Distillation**<br><sub>Community MOPD Proposal</sub>"
        c2: "`harness-hub` Community Discussions"
        c3: "Distill per-harness RL LoRAs (`pi`, `hermes`, `opencode`, `dsh`) as teachers back into a single student base (`Qwen3.8-27B`) to avoid rank-96 merge dilution."
        c4: "🧪 Next evolutionary step beyond `PEFT cat` once a `DeepSeek Harness` adapter joins the pool."

drawers:
  - summary: "Click to expand OpenEnv Validation & Multi-LoRA Serving Commands"
    lang: "bash"
    code: |
      # 1. Validate a custom Harbor RL task against oracle, floor, canary, & determinism gates
      openenv validate path/to/task --sandbox hf-sandbox

      # 2. Serve one frozen Qwen3.8-27B base with hot-swappable specialist + super adapters
      vllm serve Qwen/Qwen3.8-27B --enable-lora --max-lora-rank 128 \
        --lora-modules \
          pi=harness-hub/Qwen3.8-27B-pi-adapted \
          hermes=harness-hub/Qwen3.8-27B-hermes-adapted \
          super=harness-hub/Qwen3.8-27B-super-adapter
