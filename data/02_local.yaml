id: "02-local"
number: "02"
title: "Chapter 02 · Local AI Models (16GB VRAM + 64GB RAM)"
short_title: "Ch 02: Local Models"
output_file: "book/02-local-16vram-64ram.md"
part: "PART I: MODELS & ACCESS"
verdict: >-
  Never spill dense >16GB models into system RAM (the PCIe cliff). Keep dense 24B–27B brains + Harness Adapters 100% inside 16GB VRAM (Zone 1),
  and exploit your 64GB DDR5 RAM exclusively for sparse MoEs activating 2.5B–6B parameters per token (Zone 2).
read_if: "You are selecting local LLMs, coding adapters, or System-1 decision models for a 16GB GPU + 64GB RAM workstation (or Apple Silicon Mac)."

mermaid: |
  flowchart LR
      subgraph Z1 ["⚡ ZONE 1: 100% IN 16GB VRAM (<= 15 GB)"]
          Z1A["💻 Coding & Strict Chat<br/>Inkling 2 Mini (UD-Q3) · Qwen3.8-27B<br/>+ HF Rank-96 Super-Adapter (+912 MiB)"]
          Z1B["🧠 Vision, Audio & Decisions<br/>Gemma 4 (26B-A4B Vis / 12B Audio)<br/>Devstral Small 2 · Laya (678–846 MB)"]
      end
      subgraph Z2 ["🚀 ZONE 2: 16GB VRAM + 64GB RAM HYBRID (18–73 GB)"]
          Z2A["🔥 Frontier Sparse MoE Coding<br/>Qwen3.8-Flash-Next (180B: IQ1_M/Q2_0)<br/>Qwen3-Coder-Next (80B) · Inkling 2 Mini (Q4)"]
          Z2B["🔬 Olympiad Logic & Speed MoEs<br/>Recursive Flint (39.8B-A2.5B) · North-Mini-Code<br/>Muse Glimmer (DFlash) · Nemotron-Cascade-2"]
      end

forage_local_profiles:
  inkling-coding:
    zone: "Zone 1/2 (13-18 GB)"
    model: "unsloth/Inkling-2-Mini-GGUF (UD-Q3_K_XL or UD-Q4_K_XL + mmproj)"
    runtime: "Unsloth Runtime / Fork (b12631+) — stock llama.cpp lacks looped-layer root GGUF support"
    launch: "unsloth run unsloth/Inkling-2-Mini-GGUF:UD-Q4_K_XL --spec-draft-n-max 2"
  qwen-27b-super-adapter:
    zone: "Zone 1 (16GB VRAM: Base IQ4_XS + 912 MiB F16 LoRA)"
    model: "Qwen3.8-27B + harness-hub/Qwen3.8-27B-super-adapter (rank-96 LoRA for pi/Hermes/OpenCode)"
    runtime: "llama-server (--lora) or Mac MLX (netprojects/Qwen3.8-27B-super-adapter-MLX-6bit)"
    launch: "llama-server -m Qwen3.8-27B-IQ4_XS.gguf --lora Qwen3.8-27B-super-adapter-F16.gguf -ngl 99 -fa on -c 65536 -ctk q8_0 -ctv q8_0"
  qwen-27b-pi-specialist:
    zone: "Zone 1 (16GB VRAM: Base IQ4_XS + 304 MiB F16 LoRA, Thinking Off)"
    model: "Qwen3.8-27B + harness-hub/Qwen3.8-27B-pi-adapted (64.7% SWE-Pro hard-51 under pi)"
    runtime: "llama-server (--lora + enable_thinking:false)"
    launch: "llama-server -m Qwen3.8-27B-IQ4_XS.gguf --lora Qwen3.8-27B-pi-lora-F16.gguf --chat-template-kwargs '{\"enable_thinking\": false}' -ngl 99 -fa on -c 65536 -ctk q8_0 -ctv q8_0"
  qwen-27b-vram:
    zone: "Zone 1 (100% in 16GB VRAM)"
    model: "unsloth/Qwen3.8-27B-GGUF (IQ4_XS / UD-IQ3_S)"
    runtime: "llama-server (CUDA + Flash Attention)"
    launch: "llama-server -m Qwen3.8-27B-IQ4_XS.gguf -ngl 99 -fa on -c 32768 -ctk q8_0 -ctv q8_0"
  qwen-flash-180b:
    zone: "Zone 2 Ceiling (66.4-70.5 GB + MTP)"
    model: "unsloth/Qwen3.8-Flash-Next-GGUF (UD-IQ1_S / UD-IQ1_M / UD-Q2_0)"
    runtime: "llama-server / Unsloth Dynamic v3.1 (51B N-gram prefetched in 64GB RAM)"
    launch: "llama-server -m Qwen3.8-Flash-Next-UD-IQ1_M.gguf -ngl 99 -fa on --n-cpu-moe 36 --load-mode none"
  flint-coding:
    zone: "Zone 2 Sweet Spot (25.05 GB)"
    model: "unsloth/Recursive-Flint-GGUF (UD-Q4_K_XL)"
    runtime: "llama-server (Hybrid MoE Offload)"
    launch: "llama-server -m Recursive-Flint-UD-Q4_K_XL.gguf -ngl 99 -fa on -c 65536 --n-cpu-moe 18"
  laya-decision:
    zone: "Zone 1 CPU/NPU (678-846 MB)"
    model: "convaiinnovations/laya-typed-decisions"
    runtime: "Unsloth Desktop Decision API (localhost:8888) or laya.cpp"
    launch: "unsloth serve-decision convaiinnovations/laya-typed-decisions --port 8888"

sections:
  - heading: "1. Local Text, Coding & Reasoning Roster (Zone 1 & Zone 2)"
    headers: ["Role & Memory Zone", "Verified Local Models", "Origin, License & Footprint", "Benchmark Proof & Hardware Gotcha"]
    rows:
      - c1: "**Looped MoE Coding Star**<br><sub>Zone 1 (`Q3`) & Zone 2 (`Q4`/`Q8`)</sub>"
        c2: "**`Inkling 2 Mini`**<br><sub>**26.4B** total / **3.4B** base (**5.4B** eff.) · **1M ctx**</sub><br><sub>24 layers (middle 12 looped 3×) + `DSpark` drafter</sub>"
        c3: "`US` · `Apache-2.0` + AUP<br><sub><kbd>7.76–22.87 GB</kbd> GGUF (`UD-Q4_K_XL` **17.6 GB** + `639 MB` vision)</sub>"
        c4: "🏆 **79.2%** SWE-bench Verified, **77.9%** SWE-Pro v2 Hard, **0.703** IPW (*lab-reported*; 20.1 AA Index).<br>⚠️ Trails `Qwen3.8-27B` on strict chat (`50%` MultiChallenge, `-8.6` AA-Omniscience); requires Unsloth runtime + `--spec-draft-n-max 2`."
      - c1: "**Pure 16GB VRAM Kings**<br><sub>Zone 1 · <= 15 GB Footprint</sub>"
        c2: "**`Qwen3.8-27B`** · `Dense Vision+Text`<br><sub>Beats Flint on Terminal-Bench (**73.0**) & SWE-Pro (**94.9**)</sub><br>**`Gemma 4 (26B-A4B)`** · `Text+Vision Only`<br><sub>**3.8B active** · ~140 tok/s in 16GB VRAM</sub>"
        c3: "`CN` · `Apache-2.0`<br>`US` · `Apache-2.0`<br><sub><kbd>13–15 GB</kbd> (`IQ4_XS` / `UD-IQ3_S`)</sub>"
        c4: "✅ **`Qwen3.8-27B`** is #1 for strict instruction-following & dense coding.<br>⚠️ **Gemma 4 Audio Trap:** Only `E2B`/`E4B`/`12B` process audio—`26B-A4B` is **Text + Vision only**."
      - c1: "**Harness-Adapted 27B LoRAs**<br><sub>Zone 1 · +304–912 MiB over Base</sub>"
        c2: "**`Qwen3.8-27B-super-adapter`** (`rank-96`)<br><sub>Merged `pi` + `Hermes` + `OpenCode` LoRA (wt ½)</sub><br>**`Qwen3.8-27B-{pi|hermes|opencode}-adapted`**"
        c3: "`HF` · `Apache-2.0`<br><sub><kbd>+304–912 MiB</kbd> GGUF (`--lora`) or `MLX-6bit` (Mac)</sub>"
        c4: "🏆 **Thinking On:** **55.5%→63.5%** mean pass@1 (**31–48%** fewer tool calls). **Thinking Off (`pi`):** **39.2%→64.7%** SWE-Pro hard-51 (**56–72%** fewer calls).<br>⚠️ Pick specialist w/ thinking off, super-adapter w/ thinking on; mild pre-tool reasoning leakage (`arXiv:2610.14270`)."
      - c1: "**Rescued 180B Frontier Flash**<br><sub>Zone 2 Ceiling · 66–73 GB Total</sub>"
        c2: "**`Qwen3.8-Flash-Next`**<br><sub>**180B** (125B MoE + 51B N-gram + 4B MTP) / **6B active**</sub><br><sub>Unsloth Dynamic v3.1 (`UD-IQ1_S` / `IQ1_M` / `Q2_0`)</sub>"
        c3: "`CN` · `qwen-community-1.0`<br><sub><kbd>66.4–70.5 GB</kbd> + **1.9–2.8 GB** MTP (9–13 GB OS margin)</sub>"
        c4: "🏆 **91.9** DeepSWE 1.1; 51B N-gram prefetches asynchronously from 64GB DDR5 at near-GPU speed.<br>⚠️ **Hard Cap:** Never load `UD-Q2_K_XL` (79.6 GB) on 16+64 GB—leaves 0 GB for OS/KV cache."
      - c1: "**Hybrid Agentic Coders**<br><sub>Zone 2 · 19–49 GB Sparse MoE</sub>"
        c2: "**`Qwen3-Coder-Next (80B-A3B)`** (~49 GB)<br>**`Recursive Flint (39.8B-A2.5B)`** (~25 GB)<br>**`North-Mini-Code-1.0 (30B-A3B)`** (~19 GB)"
        c3: "`CN/US/CA` · `Apache-2.0`<br><sub><kbd>19–49 GB</kbd> (`UD-Q4_K_XL`) · 2.5B–3B active</sub>"
        c4: "🏆 `80B-A3B`: 512-expert workhorse; `North-Mini-Code`: multi-harness specialist.<br>⚠️ `Flint` scores (**89.7%** SWE-Pro v2) are *vendor-reported* and trail `Qwen3.8-27B` on Unsloth evals."
      - c1: "**Olympiad Logic, Agents & Speed**<br><sub>Zone 1 & 2 · 4–24 GB</sub>"
        c2: "**`Nemotron-Cascade-2 (30B-A3B)`** (90.9% AIME)<br>**`Meta Muse Glimmer (30B + DFlash)`** (~20 GB)<br>**`Nemotron-3.5-Bolt (74B-A9B)`** (24 GB 2-bit QAT)<br>**`DiffusionGemma (26B-A4B)`** & **`Devstral Small 2`**"
        c3: "`US/EU` · `Apache-2.0` / `OpenMDW`<br><sub><kbd>15–24 GB</kbd> · `DFlash` 16-tok drafter</sub>"
        c4: "🏆 `Muse Glimmer` (**94.7%** AIME, **65.9%** OSWorld) drafts 16 tokens/pass; `DiffusionGemma` denoises 256-tok blocks in parallel."

  - heading: "2. System-1 Local Decision Models (Non-Autoregressive)"
    headers: ["Role & Job", "Verified Local Models", "Memory & Latency", "Wiring & Calibration Gotcha"]
    rows:
      - c1: "**Zero-Token Agent Gates**<br><sub>Tool safety, trace audit, memory</sub>"
        c2: "**`Laya`** (`convaiinnovations/laya`)<br><sub>• `laya-typed-decisions` (**846 MB**)<br>• `laya-multilingual` (**678 MB**, 100+ langs)</sub>"
        c3: "<kbd>678–846 MB</kbd> (CPU/NPU/WebGPU)<br><sub>⚡ **<100–500ms** · 64 questions/pass</sub>"
        c4: "🔌 Serve via **Unsloth Decision API** (`localhost:8888`, `typesafe-sdk`) or `laya.cpp`.<br>⚠️ Threshold on `probabilities` (not `confidence`); review borderline *superseded vs contradicted* cases."
      - c1: "**Custom 16K Clef-Head**<br><sub>Domain-tuned local classifier</sub>"
        c2: "**`Qwen3.5-4B` / `Qwen3.8` / `Gemma 4`**<br><sub>+ `Clef Head` via `Unsloth DecisionTrainer`</sub>"
        c3: "<kbd>3–15 GB VRAM</kbd><br><sub>⚡ Single pass up to **16,384 tok**</sub>"
        c4: "🏆 1-epoch 4-bit LoRA (`r=16`/`64`) lifts routing accuracy from ~35% zero-shot to **78%–81%** with zero output tokens generated."

