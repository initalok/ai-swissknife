id: "04-harnesses"
number: "04"
title: "Chapter 04 · Agent Harnesses, Protocols & Safety"
short_title: "Ch 04: Harnesses"
output_file: "book/04-harnesses-protocols.md"
part: "PART II: THE ENGINE ROOM"
verdict: >-
  The model gets the credit, but the harness decides whether multi-hour agent loops finish cleanly or burn tokens.
  Pair modular harnesses (Antigravity, Pi/Durable Pi, Zed ACP) with on-demand Skills, retrieval Context Archival, and a `safeagents` proxy.
read_if: "You are wiring coding/research agents, designing `AGENTS.md`/`SKILL.md` bundles, or sandboxing tool calls."

mermaid: |
  flowchart LR
      USER["👤 HUMAN REVIEW<br/>Zed ACP · Antigravity GUI · Pi TUI"] --> HARNESS["⚙️ HARNESS LOOP<br/>Antigravity · Pi/Durable Pi · OpenCode · Claude Code"]
      HARNESS --> PROTO["📚 CONTEXT & TOOLS<br/>AGENTS.md · On-Demand SKILL.md · Retrieval Archival"]
      HARNESS --> GUARD["🛡️ SAFETY PROXY<br/>safeagents (atif-scan + Laya/Decision Judge)"]
      GUARD --> LLM["🧠 CLOUD / LOCAL MODEL<br/>Ch 01 Gateways or Ch 02 Local Unsloth/llama"]

sections:
  - heading: "1. Agent Harnesses, IDEs & Durable Execution"
    headers: ["Harness / Platform", "Core Architecture", "Standout Capabilities (Nov 2026)", "Best Pairing & Gotcha"]
    rows:
      - c1: "**Google Antigravity**<br><sub>`2.0 Desktop` · `CLI` · `SDK`</sub>"
        c2: "Unified Google agentic harness<br><sub>Shared config across GUI + CLI</sub>"
        c3: "Live w/ **`Gemini 4 Hydrogen`** (fast Everyday/Thinking + Task mode), **`3.8 Flash`**, & **`4 Argon/Carbon/Neon`**; `/agents` parallel subagents, `ctrl+k` approval, `@conversation` import."
        c4: "✅ Export directly from AI Studio Build into local Antigravity with full context intact."
      - c1: "**Pi (`v0.83`) & `Durable Pi`**<br><sub>`pi.dev` · `disler/durable-pi`</sub>"
        c2: "MIT minimalist TUI/RPC/SDK +<br><sub>SQLite crash-resumable backend</sub>"
        c3: "Built-in **`MCP + Codemode`** (JS sandbox without context bloat), `/tree` branching, **atomic shared JSON app state**, background compaction (200K/250K), live mid-run tool hot-swap."
        c4: "🏆 Reference harness for `Inkling 2 Mini` (**71.6%** TB2.1) & HF's `Qwen3.8-27B-pi-adapted` (**64.7%** SWE-Pro hard-51)."
      - c1: "**Zed Editor + `ACP`**<br><sub>Agent Client Protocol (`Apache-2.0`)</sub>"
        c2: "Native IDE multi-file review UI<br><sub>Zero Zed server telemetry</sub>"
        c3: "Official **ACP Registry** unifies `Pi`, `Claude Agent`, `Codex`, `Gemini CLI`, `OpenCode`, `Cursor`, & `Poolside` while forwarding local MCP servers."
        c4: "✅ Eliminates terminal diff blindness when running local or cloud CLI coding agents."
      - c1: "**OpenCode · Claude Code · Hermes**<br><sub>Vendor-agnostic & swarm CLIs</sub>"
        c2: "Terminal agent loops +<br><sub>Pre/post shell lifecycle hooks</sub>"
        c3: "`Claude Code` wires cleanly to local models via **Unsloth's Anthropic endpoint**; `OpenCode` & `Hermes` both have official HF RL harness adapters on `Qwen3.8-27B`."
        c4: "⚠️ OpenCode & Hermes do not auto-compact like `Pi` by default—watch for rapid context overflow on giant repos."

  - heading: "2. Protocols, Skills, Context & Runtime Safety"
    headers: ["Pattern / Tool", "Standard / Endpoint", "Why It Beats Legacy Approaches", "Production Guardrail"]
    rows:
      - c1: "**`safeagents` Proxy & Plugins**<br><sub>`huggingface/safeagents`</sub>"
        c2: "Transparent OpenAI/Anthropic proxy<br><sub>Works w/ Claude Code, Pi, Hermes, OpenCode</sub>"
        c3: "3-stage guard: request checks, `atif-scan` (10–20ms on Apple Silicon), + optional **Decision Model judge**; Hub plugins (`hf://harness-hub/qwen-safeagents-plugin`)."
        c4: "🏆 Audited **1.3M** RL tool calls & blocked **647** suspicious calls during HF harness-adapter training."
      - c1: "**Progressive Skills (`SKILL.md`)**<br><sub>vs. Bloated MCP Tool Lists</sub>"
        c2: "`skills/<name>/SKILL.md` +<br><sub>`Pi` / `Antigravity` / `Deepy Skills`</sub>"
        c3: "Loads instructions & scripts **on demand** instead of stuffing 30+ MCP schemas into the system prompt (which destroys KV prompt caching)."
        c4: "✅ Use `Pi` **MCP + Codemode** when you need complex multi-tool orchestration in a JS sandbox."
      - c1: "**Layered Context Files**<br><sub>Global -> Repo -> Subdir</sub>"
        c2: "`AGENTS.md` · `CLAUDE.md`<br><sub>`llms.txt` · `llms-full.txt`</sub>"
        c3: "Gives agents deterministic foraging routes and repo invariants in <500 tokens before reading a single source file."
        c4: "⚠️ Never let `AGENTS.md` grow into a 5,000-token manual—keep micro-details in on-demand skills."
      - c1: "**Retrieval Context Archival**<br><sub>vs. Lossy Rolling Summaries</sub>"
        c2: "Unsloth Archival · `Durable Pi`<br><sub>`/tree` + `search_history`</sub>"
        c3: "Archives old turns to searchable SQLite/vector history at 200K tokens rather than overwriting nuances via destructive summarization."
        c4: "✅ Pair with `Laya` + `all-MiniLM-L6-v2` (23 MB) for auditable memory invalidation ledgers."

drawers:
  - summary: "Click to expand `safeagents` Transparent Proxy Quickstart"
    lang: "bash"
    code: |
      # Put safeagents between any local/cloud harness (Pi, OpenCode, Claude Code) and your LLM server
      safeagents start http://localhost:8000 \
        --plugin hf://harness-hub/qwen-safeagents-plugin
