sections:
  - heading: "1. Agent Harnesses by Architectural Role"
    headers: ["Role & Harness", "Core Architecture", "Standout Capabilities (Nov 2026)", "Best Pairing & Gotcha"]
    rows:
      - c1: "**🧱 Building-Block Kernel**<br>**`Pi` (`pi.dev`) + `Pi Durable`**<br><sub>MIT · TUI / RPC / SDK</sub>"
        c2: "Minimal hackable loop you own +<br><sub>SQLite crash-resumable state</sub>"
        c3: "Transparent context assembly, built-in **`MCP + Codemode`** (JS sandbox), `/tree` DAG session branching, atomic shared JSON app state, background compaction (200K/250K), live mid-run tool hot-swap."
        c4: "🏆 Highest-scoring target for HF `Qwen3.8-27B-pi-adapted` (**64.7%** SWE-Pro hard-51) & `Inkling 2 Mini`.<br>⚠️ Intentionally omits built-in approval gates—pair w/ `safeagents` or sandboxes."
      - c1: "**🧩 Plugin-Everything Platform**<br>**`DeepSeek Harness` (`dsh`)**<br><sub>MIT · 287K+ ★ · `deepseek-ai`</sub>"
        c2: "**Cordis** (*Everything is a Plugin*)<br><sub>Web (`npx @deepseek-ai/dsh web`) & Desktop</sub>"
        c3: "Lets you **swap the agent loop itself** as a plugin, **Creator Mode** (author live plugins in chat), read-only-by-default **built-in sandbox**, trace inspector, cron tasks, & first-party plugins driving **Claude Code / Codex** as sub-agents."
        c4: "✅ Supports DeepSeek, Anthropic, OpenAI, Moonshot, Z.ai, & local OpenAI-compat servers.<br>⚠️ Fast-moving developer preview (`0.2.3-alpha.2`)—pin plugin versions."
      - c1: "**🌱 Self-Improving Daemon**<br>**`Hermes Agent` (`v0.23.4`)**<br><sub>MIT · 266K+ ★ · `NousResearch`</sub>"
        c2: "Persistent learning loop +<br><sub>Multi-surface (Desktop/VPS/Telegram)</sub>"
        c3: "#1 globally on OpenRouter token volume; persistent memory + **autonomous skill creation**, 40+ tools, ACP support, cron scheduler, isolated subagents, & disk archival of pruned tool outputs."
        c4: "🏆 Official HF Harness Adapter target (`Qwen3.8-27B-hermes-adapted` & `LFM2.5-24B`).<br>⚠️ Does not auto-compact aggressively like `Pi`—cap context/thinking tokens on giant repos."
      - c1: "**🖥️ IDE & Vendor Harnesses**<br>**`Google Antigravity` · `Zed ACP` · `OpenCode`**"
        c2: "Native multi-file review UI +<br><sub>Agent Client Protocol (`Apache-2.0`)</sub>"
        c3: "**Antigravity:** Live w/ **`Gemini 4 Hydrogen`** (Everyday/Thinking + Task mode), `3.8 Flash`, & `4 Argon/Carbon/Neon`. **Zed ACP Registry:** Unifies `Pi`, `Claude`, `Codex`, `Gemini`, & `OpenCode` w/ zero server telemetry."
        c4: "✅ Wire `Claude Code` or `OpenCode` to local `Qwen3.8-27B-super-adapter` via Unsloth's Anthropic/OpenAI endpoints."

  - heading: "2. Protocols, Skills, Context & Runtime Safety"
    headers: ["Pattern / Tool", "Standard / Endpoint", "Why It Beats Legacy Approaches", "Production Guardrail"]
    rows:
      - c1: "**`safeagents` Proxy & Plugins**<br><sub>`huggingface/safeagents`</sub>"
        c2: "Transparent OpenAI/Anthropic proxy<br><sub>Works w/ Pi, Hermes, OpenCode, Claude</sub>"
        c3: "3-stage guard: request checks, `atif-scan` (10–20ms on Apple Silicon), + optional **Decision Model judge**; Hub plugins (`hf://harness-hub/qwen-safeagents-plugin`)."
        c4: "🏆 Audited **1.3M** RL tool calls & blocked **647** suspicious calls during HF harness-adapter training."
      - c1: "**Progressive Skills (`SKILL.md`)**<br><sub>vs. Bloated MCP Tool Lists</sub>"
        c2: "`skills/<name>/SKILL.md` +<br><sub>`obra/superpowers` · `Deepy Skills`</sub>"
        c3: "Loads instructions & scripts **on demand** instead of stuffing 30+ MCP schemas into the system prompt (which destroys KV prompt caching)."
        c4: "✅ Use `Pi` **MCP + Codemode** when you need complex multi-tool orchestration in a JS sandbox."
      - c1: "**Layered Context & Archival**<br><sub>vs. Lossy Rolling Summaries</sub>"
        c2: "`AGENTS.md` · `llms.txt`<br><sub>Unsloth Archival · `Durable Pi`</sub>"
        c3: "Gives deterministic repo invariants in <500 tokens and archives old turns to searchable SQLite/vector history at 200K tokens rather than destructive summarization."
        c4: "✅ Pair with `Laya` + `all-MiniLM-L6-v2` (23 MB) for auditable memory invalidation ledgers."

