sections:
  - heading: "1. Underground 12–16GB Engine Hacks & Audit Loops"
    headers: ["Community Project", "Hardware & Stack", "Verified IRL Results", "Practical Takeaway (`⚠️ Gotcha`)"]
    rows:
      - c1: "**`Basalt` (`0.5.5+`) & `RustingStrata`**<br><sub>Alt-engines for `Inkling 2 Mini`</sub>"
        c2: "RTX 3060 12GB · RTX 5060 Ti 16GB<br><sub>NVFP4 + `DSpark` native kernels</sub>"
        c3: "`Basalt` hits **up to 60 tok/s on a 16GB RTX 5060 Ti** (spilling cold experts to RAM only on long chats) & **613 tok/s** on 5090. `RustingStrata` hits **31 tok/s on RTX 3060 12GB** (vs 9–10 tok/s stock `llama.cpp`)."
        c4: "🔥 Proves community engines already unlock 3×–6× speedups on looped MoEs.<br>⚠️ Rapidly evolving single-GPU engines—pin working git commits."
      - c1: "**`pecera-engine` + Hermes Self-Check**<br><sub>r/LocalLLaMA indie build (Nov 2026)</sub>"
        c2: "Single 12GB RTX 4070 Ti +<br><sub>`Inkling 2 Mini` (`mixC` 10.8 GiB) + Hermes</sub>"
        c3: "Rebased `realugbun` fused CUDA glue-op kernels onto `llama.cpp` (**76–80 tok/s**); paired w/ **3,000-tok thinking cap + 5 self-check skills + 2nd audit session** to score **47/89 (52.8%)** on TB2.0."
        c4: "🏆 **Reusable IRL Pattern:** Capping thinking tokens + forcing a fresh 2nd-pass audit session eliminates small-model debug loops."
      - c1: "**Cross-Derivative LoRA & Mac MLX Builds**<br><sub>HF `harness-hub` community</sub>"
        c2: "`Qwen3.8-27B` adapters +<br><sub>`Swift-1.5` · `netprojects` MLX-6bit</sub>"
        c3: "Builders confirmed HF's tiny 304–912 MiB LoRAs transfer cleanly to **`Qwen3.8` derivatives (`Swift-1.5`)** and packaged **MTP-preserving `MLX-6bit`** Mac builds (~65 tok/s 4-bit)."
        c4: "💡 Test HF harness adapters against your favorite `Qwen3.8` community fine-tunes before training from scratch."

  - heading: "2. Community Skill Packs, Harness Extensions & Production Ops"
    headers: ["Community Effort", "Target Harness(es)", "What People Ship IRL", "Adoption Rule (`⚠️ Gotcha`)"]
    rows:
      - c1: "**`obra/superpowers`**<br><sub>Jesse Vincent · + Hermes port</sub>"
        c2: "`Pi` · `Antigravity` · `Hermes`<br><sub>`OpenCode` · `Claude Code` · `Codex`</sub>"
        c3: "15 discipline skills enforcing **Brainstorm → Chunked Spec → Red/Green TDD → Fresh Subagent per Task → Systematic Debugging → Verification Before Completion** for 2+ hour autonomous runs."
        c4: "🏆 Highest-ROI skill pack for stopping agent drift.<br>⚠️ On Hermes, use `obra-superpowers-hermes` (`hermes-tools.md`), not raw Claude Code tool names."
      - c1: "**`pi-subagents-community`**<br><sub>`npm:pi-subagents-community`</sub>"
        c2: "`Pi` (`v1.0+`)"
        c3: "Adds Claude Code-style parallel sub-agents, a navigable fleet widget, mid-run steering, & JS orchestration (`agent()`, `parallel()`, `pipeline()`) without bloating `Pi`'s minimal kernel."
        c4: "✅ Keeps `Pi` lean while unlocking multi-agent orchestration on demand."
      - c1: "**`wanbinyu-harness-toolbox`**<br><sub>`dsh-launcher` · `dsh-plugins` · `dsh-theone`</sub>"
        c2: "`DeepSeek Harness` (`dsh`)"
        c3: "Bilingual Cordis plugin catalog w/ SHA-256 verified assets, Windows updater preserving `%USERPROFILE%\\.dsh` data, and an experimental LAN Android client."
        c4: "⚠️ Independent community repo; check peer compatibility after `dsh` alpha updates."
      - c1: "**IRL Production Ops Patterns**<br><sub>Hermes & OpenClaw builders</sub>"
        c2: "`Hermes Agent` · `OpenClaw`<br><sub>`Pi Durable` + Obsidian</sub>"
        c3: "• **SRE:** `Hermes Incident Commander` & PR review triage (~30% shorter review cycles).<br>• **Knowledge:** Obsidian + `Defuddle` + `LLM Wiki` memory.<br>• **Research:** Cron 200–500 source digests (6–8 hrs/wk → 30 min edit)."
        c4: "⚠️ **#1 IRL Failure Mode:** Never jump to 100% autonomy on day 1—graduate from *agent drafts, human approves* to *agent ships, human audits 10–20% weekly*."

  - heading: "3. Local Indie Media, Interactive Worlds & Hardware Chains"
    headers: ["Community Pipeline", "Chained Local Tools", "What Creators Build IRL", "License / Hardware Catch (`⚠️ Gotcha`)"]
    rows:
      - c1: "**Indie Film & Music Video Studio**<br><sub>`WanGP Showrunner` + `hoodtronik` fork</sub>"
        c2: "`WanGP v20.12` + `Qwen-Image-2.1`<br><sub>+ `MiniMax H3` / `Wan 2.2`</sub>"
        c3: "Multi-shot local stories using recurring location **Sets** (consistent rooms across cuts), per-shot start/end previz guides, cast-card voice checks, & 1-click **Deep Review** lip/continuity audits."
        c4: "✅ Runs on 8–16GB GPUs via Extreme Chunker + MMGP v4.<br>⚠️ Community Showrunner forks track specific upstream commits."
      - c1: "**Walkable Worlds + Sound & Mesh→CAD**<br><sub>Community creators & hardware hackers</sub>"
        c2: "`Hy-Nomas` + `EVOKE` + `LTX-2.5`<br><sub>+ `CADMAGEDDON` (Mesh → CAD)</sub>"
        c3: "Chains `Hy-Nomas` WASD worlds into **`LTX-2.5`** for video-conditioned audio & interactive roleplay; hardware makers use **`CADMAGEDDON`** locally to reverse 3D meshes into editable parametric CAD."
        c4: "⚠️ `Hy-Nomas`/`EVOKE` use NVIDIA PixelUMM (**non-commercial previs/pitch use only**)."

