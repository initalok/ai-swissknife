    provider_refs: ["mistral-plateforme", "google-ai-studio", "unsloth-local"]

  - col1_modality: "**Image & Scene Editing**<br><sub>Photorealism, typography, in-place edit</sub>"
    col2_models: "**`FLUX.2` & `FLUX.1 Kontext`**<br><sub>🏆 In-context editing without LoRAs</sub><br>**`Qwen Image 3` / `Seedream 5`**<br><sub>🏆 Best bilingual text & layout control</sub>"
    col3_cloud: "[**Pollinations AI**](https://pollinations.ai/)<br><sub><kbd>Keyless</kbd> Zero-auth `Flux` REST URL</sub><br>[**HF Serverless**](https://huggingface.co/)<br><sub><kbd>No Card</kbd> Rate-limited open inference</sub>"
    col4_local_gotcha: "⚙️ **Open Weights:** **`FLUX.2 Klein`** & **`Qwen Image 3`** (`Apache-2.0`)<br>⚠️ **Gotcha:** Pollinations is a shared public pool; add retry backoff."
    provider_refs: ["pollinations", "unsloth-local"]

  - col1_modality: "**Video & Music / SFX**<br><sub>T2V, I2V, synchronized stereo audio</sub>"
    col2_models: "**`FLUX 3 Max` & `Seedance 2.5`**<br><sub>🏆 Tied #1 Elo (~1,139); 12.4s render</sub><br>**`Hailuo H3-Max` / `Wan 3.0`**<br><sub>🏆 Native stereo audio (`H3`) · #1 Open (`Wan`)</sub>"
    col3_cloud: "[**MiniMax API**](https://www.minimax.io/)<br><sub><kbd>Trial</kbd> **$5** free signup credits</sub><br>**No Permanent Free Cloud Video API**"
    col4_local_gotcha: "⚙️ **Open Weights:** **`Wan 3.0`**, **`LTX 2.3`** (Video) & **`Stable Audio Open`** (SFX)<br>⚠️ **Gotcha:** Avoid fragile unofficial Suno/Udio cookie scrapers."
    provider_refs: ["unsloth-local"]

# 5. SECTION 4: GROUNDING, SEARCH & RAG MATRIX (Strictly 4 Columns)
grounding_matrix:
  - col1_role: "**Keyless Web Scraper**<br><sub>Clean Markdown for LLM context</sub>"
    col2_tool: "[**Firecrawl (`Keyless` & API)**](https://www.firecrawl.dev/)<br><sub>🏆 Lowest token bloat in benchmarks</sub>"
    col3_quota: "<kbd>Keyless</kbd> Daily per-IP free quota<br><sub>+ **500 credits** on standard signup</sub>"
    col4_edge: "✅ **7,456 median tokens/task** (vs 15K+ on raw HTML scrapers).<br>⚠️ Keyless mode is IP-rate-limited; use API key for concurrency."

  - col1_role: "**Zero-SDK URL / PDF Reader**<br><sub>Instant prefix conversion</sub>"
    col2_tool: "[**Jina Reader (`r.jina.ai`)**](https://jina.ai/reader/)<br><sub>🏆 Zero-install URL-to-Markdown</sub>"
    col3_quota: "<kbd>Keyless</kbd> Free rate-limited prefix<br><sub>+ **10,000,000 free tokens** w/ API key</sub>"
    col4_edge: "✅ Prepend `https://r.jina.ai/` to any URL or PDF link.<br>⚠️ Use `https://s.jina.ai/?q=query` for keyless web search."

  - col1_role: "**Neural & Deep Agent Search**<br><sub>Semantic web retrieval</sub>"
    col2_tool: "[**Exa 3.0 (`Lite` / `Deep`)**](https://exa.ai/)<br><sub>🏆 Built natively for autonomous agents</sub>"
    col3_quota: "<kbd>No Card</kbd> **$10/mo recurring credits**<br><sub>+ $10 bonus (~2,500 `Lite` searches/mo)</sub>"
    col4_edge: "✅ Controllable reasoning effort (`Lite` @ $4/1k vs `Deep Search`).<br>⚠️ Capped at **10 QPS** on the free tier."

  - col1_role: "**Pre-Chunked RAG Search**<br><sub>Factual snippet injection</sub>"
    col2_tool: "[**Tavily Search API**](https://tavily.com/)<br><sub>🏆 Skips custom HTML chunking pipelines</sub>"
    col3_quota: "<kbd>No Card</kbd> **1,000 credits/mo forever**<br><sub>Researcher Plan (+ Free Student Tier)</sub>"
    col4_edge: "✅ Returns scored, pre-chunked context blocks ready for prompt injection.<br>⚠️ `advanced` depth costs 2 credits/call vs 1 for `basic`."

  - col1_role: "**Embeddings & Reranking**<br><sub>Two-stage vector + probability filter</sub>"
    col2_tool: "[**Cohere `Embed 5` & `Rerank 5`**](https://cohere.com/)<br><sub>🏆 Shared `Pro`/`Fast` embedding space</sub>"
    col3_quota: "<kbd>No Card</kbd> **1,000 calls/mo** (Trial Key)<br><sub>10 Rerank/min · 20 Chat/min</sub>"
    col4_edge: "✅ Index offline w/ `Embed 5 Pro`, query w/ `Embed 5 Fast` (98.4% retention), filter via `Rerank 5` (32K ctx, JSON/YAML native)."

  - col1_role: "**Academic & Paper Graph**<br><sub>Citations, abstracts, open PDFs</sub>"
    col2_tool: "[**OpenAlex**](https://openalex.org/) + [**arXiv API**](https://arxiv.org/help/api/)<br><sub>🏆 250M+ scholarly works & citations</sub>"
    col3_quota: "<kbd>Keyless</kbd> **100,000 requests/day**<br><sub>100% free forever</sub>"
    col4_edge: "✅ Pass `?mailto=you@domain.com` in OpenAlex URLs to enter the fast polite pool with zero auth keys."

# 6. SECTION 5: THE GRAVEYARD (Enforced by Linter & Upstream Sync Filter)
graveyard:
  - name: "GitHub Models (`models.inference.ai.azure.com`)"
    match_pattern: "inference.ai.azure.com"
    reason: "Officially retired on July 30, 2026. Still listed in 90% of legacy free API repos, but endpoints are dead."
  - name: "SambaNova Cloud (Legacy Free Tier)"
    match_pattern: "sambanova.ai"
    reason: "Restricted free tier access; frontier models (`DeepSeek-V3.1`, `MiniMax-M3`, `Gemma-4-31B`) now require payment method/credits with 30-day deprecations."
  - name: "Together AI & Fireworks AI ('Free Tiers')"
    match_pattern: "together.ai"
    reason: "Shifted from ongoing free tiers to one-time starter credits or card-gated accounts."
  - name: "Brave Search API (Free Tier)"
    match_pattern: "brave.com/search/api"
    reason: "Requires a credit card on file for the free tier (replaced by card-free Firecrawl Keyless, Jina, Exa 3.0, and Tavily)."
  - name: "Legacy 7B-8B Generalists & `gpt-oss-120b` for Deep Reasoning"
    match_pattern: "gpt-oss-120b"
    reason: "Outclassed on SWE-bench and GPQA Diamond (`gpt-oss` scores <15% on Humanity's Last Exam vs 55%+ for `Kimi K3` / `GLM-5.3`)."
