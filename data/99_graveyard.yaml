cloud_graveyard:
  - name: "Cerebras Cloud (Legacy 'Free Tier')"
    match_pattern: "cerebras.ai"
    reason: "Confirmed Nov 18, 2026: no renewing free tier exists; the $5 / 30-day credit requires a valid payment method."
  - name: "Mistral La Plateforme (Legacy 'Free Experiment Tier')"
    match_pattern: "api.mistral.ai"
    reason: "Current billing docs require pay-as-you-go activation for API keys, disqualifying it from our strict no-card pool."
  - name: "Gemini 2.5 Pro & 2.5 Flash"
    match_pattern: "gemini-2.5-pro"
    reason: "Retiring Dec 1, 2026 (auto-routing to Gemini 3.8 Flash / 3.5 Flash-Lite). GCP $300 trials no longer cover Vertex/Gemini."
  - name: "GitHub Models (`models.inference.ai.azure.com`)"
    match_pattern: "inference.ai.azure.com"
    reason: "Officially retired July 30, 2026; endpoints are dead."
  - name: "SambaNova Cloud & Together AI ('Free Tiers')"
    match_pattern: "sambanova.ai"
    reason: "Restricted free access; frontier weights require payment methods or one-time starter credits."
  - name: "Brave Search API (Free Tier)"
    match_pattern: "brave.com/search/api"
    reason: "Requires a credit card on file (replaced by Firecrawl Keyless, Jina, Exa 3.0, and Tavily)."

local_graveyard:
  - name: "`Wan 3.0`, `Wan 2.6`, and `FLUX 3 Video`"
    match_pattern: "wan 3.0"
    reason: "Closed cloud APIs with no published weights. Use `Wan 2.2`, `LTX-2.5`, or `Kandinsky 6.0 Lite` locally."
  - name: "`Inkling 2 Small` (594B) & `Inkling` Flagship (975B)"
    match_pattern: "inkling 2 small"
    reason: "Require 354–600 GB NVFP4/4-bit memory (cloud/Tinker API only). Use `Inkling 2 Mini` (26.4B) locally."
  - name: "`GLM-5.3-Flash` (320B), `Kimi K2.7-Code` (1T), `DeepSeek-V4.1-Flash` (552B)"
    match_pattern: "glm-5.3-flash"
    reason: "Smallest usable checkpoints need 100–584 GB memory—exceeding your 80 GB total pool. Use via Chapter 01 Cloud APIs."
  - name: "`Qwen3.8-Flash-Next` at `UD-Q2_K_XL` (79.6 GB) or Larger"
    match_pattern: "qwen3.8-flash-next-ud-q2_k_xl"
    reason: "Leaves zero headroom for OS, MTP weights (2 GB), and KV cache on 16GB+64GB. Strictly cap at `UD-IQ1_S`/`IQ1_M`/`Q2_0`."
  - name: "`Nemotron-3.5-Super-VL` (120B-A12B) & Dense 70B Offloads"
    match_pattern: "llama-3.3-70b"
    reason: "Super-VL requires 82 GB+ RAM; dense 70B CPU offloading crawls at 2–4 tok/s (obsoleted by Zone 2 sparse MoEs)."
