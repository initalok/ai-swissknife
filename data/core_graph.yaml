    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    tier: "no-card-free"
    pipe_tpm: 1000000
    pipe_label: "1,000,000 TPM / 1.5K RPD (Flash)"
    effective_ctx: "1M tokens (Flash) | 32K TPM cap (Pro)"
    trains_on_data: "Yes (Exempt in EU/UK/CH)"
    tri: [0.42, 0.23, 0.35]
    color: "#38bdf8"
