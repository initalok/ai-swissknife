# ZONE A: OPINIONATED TASK ROUTES (Used by `./ask route <intent>` & Minard Flow Diagram)
routes:
  coding-agent:
    title: "Agentic Coding & Terminal CLI"
    load: "~20K tok/step × 15 steps"
    primary_provider: "zhipu-bigmodel"
    primary_model: "glm-5.3-flash"
    benchmark: "84.3% Terminal-Bench 2.1 | 79.0% SWE-bench (DeepSeek-V4-Flash)"
    fallback_provider: "google-ai-studio"
    fallback_model: "gemini-3.8-flash"
    blocked_provider: "groq-cloud"
    blocked_reason: "8K TPM cap < 20K single agent turn"

  deep-reason:
    title: "Scientific & PhD Logic Synthesis"
    load: "High-compute chain-of-thought"
    primary_provider: "nvidia-nim"
    primary_model: "moonshotai/kimi-k3"
    benchmark: "93.5% GPQA Diamond | 56.0% Humanity's Last Exam"
    fallback_provider: "google-ai-studio"
    fallback_model: "gemini-2.5-pro"
    blocked_provider: "pollinations"
    blocked_reason: "Shared community capacity drops long reasoning chains"

  repo-1m:
    title: "Full Repo / Multi-PDF Ingestion"
    load: "100K - 1,000,000 tokens/prompt"
    primary_provider: "google-ai-studio"
    primary_model: "gemini-3.8-flash"
    benchmark: "1M Effective Free Context + 1M TPM Pipe"
    fallback_provider: "cerebras-cloud"
    fallback_model: "llama-4-scout"
    blocked_provider: "groq-cloud"
    blocked_reason: "Truncated by 8K TPM ceiling"

  fim-ide:
    title: "IDE Inline Autocomplete (FIM)"
    load: "<150ms sub-second diffs"
    primary_provider: "mistral-plateforme"
    primary_model: "codestral-latest"
    benchmark: "80+ Language FIM Specialist (1B tok/mo free tier)"
    fallback_provider: "unsloth-local"
    fallback_model: "qwen3-coder-next-80b-a3b"
    blocked_provider: "nvidia-nim"
    blocked_reason: "Cold-start queue latency too high for keystroke FIM"

  fast-json:
    title: "Ultra-Fast Intent Router & JSON"
    load: "2,000+ tok/s structured schema"
    primary_provider: "cerebras-cloud"
    primary_model: "qwen-3-32b"
    benchmark: "2,000+ tok/s wafer-scale structured output"
    fallback_provider: "groq-cloud"
    fallback_model: "qwen3.8-27b"
    blocked_provider: "google-ai-studio"
    blocked_reason: "15 RPM limit bottlenecks high-QPS micro-routing"

  voice-audio:
    title: "Real-Time Voice (STT / TTS / Duplex)"
    load: "<200ms audio stream"
    primary_provider: "groq-cloud"
    primary_model: "whisper-large-v3"
    benchmark: "20 RPM / 2,000 RPD free STT + Fish S2.1 Pro / Voxtral TTS"
    fallback_provider: "mistral-plateforme"
    fallback_model: "voxtral-tts"
    blocked_provider: "cerebras-cloud"
    blocked_reason: "Text-only inference hardware"

  rag-grounding:
    title: "Web Grounding, Scrape & Rerank"
    load: "Low-token Markdown + 32K Rerank"
    primary_provider: "google-ai-studio"
    primary_model: "firecrawl-keyless + cohere-rerank-5"
    benchmark: "7,456 median tok/scrape (Firecrawl) + Embed 5 Pro/Fast shared space"
    fallback_provider: "mistral-plateforme"
    fallback_model: "mistral-ocr-4"
    blocked_provider: "groq-cloud"
    blocked_reason: "No native search/rerank endpoint"

