pillar_id: "01-providers"
title: "Pillar 1: Verified API Gateways & Runtimes"
description: "Relational registry of active free-tier cloud gateways and local runtimes with bottleneck, context, and privacy audits."
providers:
  - id: "google-ai-studio"
    name: "Google AI Studio (Gemini API)"
    url: "https://aistudio.google.com/"
    access_type: "permanent-free"
    card_required: false
    sdk_compatibility: ["openai-compatible", "native-gemini"]
    quota_summary: "Flash: 15 RPM / 1M TPM / 1,500 RPD | Pro: 2 RPM / 32K TPM / 50 RPD"
    bottleneck: "Pro models hit 50 RPD & 32K TPM quickly; use Flash for multi-step agent loops"
    effective_free_context: "1M tokens (Flash) / 32K TPM cap (Pro)"
    trains_on_data: "Yes (Unpaid tier) — Exempt in EU/UK/EEA/CH"
    real_world_gotcha: "Only free tier capable of true 200K+ token repo ingestion via 1M TPM Flash quota."

  - id: "mistral-plateforme"
    name: "Mistral AI (La Plateforme)"
    url: "https://console.mistral.ai/"
    access_type: "permanent-free"
    card_required: false
    sdk_compatibility: ["openai-compatible", "native-mistral"]
    quota_summary: "~1 Billion tokens/month (Experiment Tier) + dedicated Codestral FIM endpoint"
    bottleneck: "RPM throttling under burst load; returns 402 if calling paid-only endpoints"
    effective_free_context: "128K-256K tokens"
    trains_on_data: "Yes (Mandatory opt-in on Free Experiment tier)"
    real_world_gotcha: "Highest monthly token ceiling on any permanent free tier, ideal for non-sensitive coding & OCR."

  - id: "cerebras-cloud"
    name: "Cerebras Cloud"
    url: "https://cloud.cerebras.ai/"
    access_type: "permanent-free"
    card_required: false
    sdk_compatibility: ["openai-compatible"]
    quota_summary: "1,000,000 tokens/day (30 RPM standard; 5 RPM on heavy frontier previews)"
    bottleneck: "5 RPM limit on preview flagship models"
    effective_free_context: "8K-128K (model dependent)"
    trains_on_data: "See developer terms"
    real_world_gotcha: "Wafer-scale 2,000+ tok/s speed makes it unbeatable for fast JSON routing and high-volume agent loops."

  - id: "groq-cloud"
    name: "Groq Cloud"
    url: "https://console.groq.com/"
    access_type: "permanent-free"
    card_required: false
    sdk_compatibility: ["openai-compatible"]
    quota_summary: "30 RPM / 1,000 RPD (LLMs) | 20 RPM / 2,000 RPD (Whisper Audio)"
    bottleneck: "Strict 6,000-8,000 TPM cap on 70B+ models"
    effective_free_context: "Capped at 6K-8K tokens per minute on free tier"
    trains_on_data: "No"
    real_world_gotcha: "Will immediately 429 on 20K-token coding agent prompts; use strictly for voice (Whisper) and small fast routers."

  - id: "openrouter-free"
    name: "OpenRouter (:free Tier)"
    url: "https://openrouter.ai/"
    access_type: "freemium-unlock"
    card_required: false
    sdk_compatibility: ["openai-compatible", "anthropic-compatible"]
    quota_summary: "20 RPM / 50 RPD ($0 balance) -> unlocks 20 RPM / 1,000 RPD with $10 one-time credit balance"
    bottleneck: "50 RPD default cap runs out in ~3 coding agent tasks without the $10 balance unlock"
    effective_free_context: "Varies by upstream host"
    trains_on_data: "Configurable via OpenRouter privacy filter headers"
    real_world_gotcha: "Holding $10 in untouched credit unlocks 1,000 free requests/day across 18+ rotating :free models."

  - id: "zhipu-bigmodel"
    name: "Z.ai / Zhipu BigModel"
    url: "https://open.bigmodel.cn/"
    access_type: "permanent-free"
    card_required: false
    sdk_compatibility: ["openai-compatible"]
    quota_summary: "5-10 concurrent requests (unlimited daily tokens on Flash series)"
    bottleneck: "Concurrency limit (5-10 simultaneous streams)"
    effective_free_context: "128K tokens"
    trains_on_data: "Standard free tier terms"
    real_world_gotcha: "Provides direct zero-cost access to GLM-5.3-Flash / GLM-4.7-Flash for terminal & MCP tool agents."

  - id: "nvidia-nim"
    name: "NVIDIA NIM (Developer Program)"
    url: "https://build.nvidia.com/"
    access_type: "permanent-free"
    card_required: false
    sdk_compatibility: ["openai-compatible"]
    quota_summary: "~40 RPM prototyping rate limit across NIM catalog"
    bottleneck: "Non-production license; occasional cold-start queuing on massive MoE models"
    effective_free_context: "32K-128K tokens"
    trains_on_data: "No (Prototyping terms)"
    real_world_gotcha: "Best free sandbox to test heavy Chinese & US open-weight flagships (DeepSeek-V4, Kimi K3, Nemotron 3)."

  - id: "pollinations"
    name: "Pollinations AI"
    url: "https://pollinations.ai/"
    access_type: "keyless-free"
    card_required: false
    sdk_compatibility: ["openai-compatible", "rest-url"]
    quota_summary: "Keyless fair-use IP rate limit"
    bottleneck: "Shared community capacity"
    effective_free_context: "Standard"
    trains_on_data: "Public/Community"
    real_world_gotcha: "Zero-signup instant endpoint for Flux image generation and lightweight text/audio prototyping."

  - id: "unsloth-local"
    name: "Unsloth Local Runtime (Dynamic 3.0 GGUF)"
    url: "https://github.com/unslothai/unsloth"
    access_type: "local-open-weights"
    card_required: false
    sdk_compatibility: ["openai-compatible", "anthropic-compatible"]
    quota_summary: "Unlimited local hardware execution (`unsloth run` / `unsloth start claude|opencode|codex`)"
    bottleneck: "Local GPU VRAM / System RAM"
    effective_free_context: "Smart auto-context scales up to 1M without VRAM OOM"
    trains_on_data: "No (100% Local)"
    real_world_gotcha: "UD-Q4_K_XL Dynamic GGUFs fix broken chat templates on Qwen3.8, GLM-5, and Gemma 4 while speaking native Anthropic/OpenAI protocols."
