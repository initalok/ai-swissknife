id: "01-cloud"
number: "01"
title: "Chapter 01 · Zero-Card Cloud APIs, Decisions & Grounding"
short_title: "Ch 01: Cloud APIs"
output_file: "book/01-cloud-apis.md"
part: "PART I: MODELS & ACCESS"
verdict: >-
  Only 6 cloud gateways remain genuinely card-free as of Nov 2026—pair Google AI Studio (Gemini 4 Hydrogen / 3.8 Flash)
  and Z.ai (GLM-4.7-Flash) for agent loops, Cloudflare/Google for $0-output System-1 decisions, and keyless Jina/Firecrawl/Exa for RAG.
read_if: "You need verified $0 cloud LLM, System-1 decision, or web-grounding endpoints without attaching a credit card."

mermaid: |
  flowchart LR
      subgraph INTENT ["1. CLOUD WORKLOAD"]
          A["🤖 Coding Agent<br/>(20K tok/step)"]
          B["🔬 500B+ Reasoning<br/>(DeepSeek / Nemotron)"]
          C["⚖️ System-1 Decisions<br/>($0 Output Tokens)"]
          D["⚡ Fast Micro-Route<br/>(<6K tok / Whisper)"]
      end
      subgraph PIPE ["2. VERIFIED NO-CARD GATEWAY"]
          P1["🔵 Google AI Studio<br/>4 Hydrogen · 3.8 Flash (1M)"]
          P2["🟢 Z.ai BigModel<br/>GLM-4.7-Flash (200K Free)"]
          P3["🟣 NVIDIA NIM / OpenRouter<br/>40 RPM / 1K RPD (10 Cr)"]
          P4["🟠 Decision 1 / Cloudflare<br/>10K RPD · Clef · Clairic"]
          TRAP["🔴 Groq Cloud<br/>8K TPM Wall (<6K / STT only)"]
      end
      A ==>|"Primary"| P1
      A -.->|"Free 200K Fallback"| P2
      A x--x|"429 on 20K Prompts"| TRAP
      B ==>|"DeepSeek-V4.1-Flash"| P3
      C ==>|"Single-Pass Probs"| P4
      D ==>|"Qwen3.8-27B / Whisper"| TRAP

providers:
  google-ai-studio:
    name: "Google AI Studio"
    url: "https://aistudio.google.com/"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    env_key: "GEMINI_API_KEY"
    tier: "tier2-cloud-free"
    default_model: "gemini-3.8-flash"
    quota: "Free tier: Gemini 4 Hydrogen (Everyday & Thinking), Gemini 3.8 Flash (1M ctx), & Decision 1 (200 RPM / 50K TPM / 10K RPD)"
    bottleneck: "Gemini 2.5 retires Dec 1, 2026; 4 Argon/Carbon/Neon, Batch, & Search Grounding are paid-only"
    effective_context: "1M (Flash)"
    trains_on_data: "Yes outside EU/UK/CH"

  zhipu-bigmodel:
    name: "Z.ai BigModel"
    url: "https://open.bigmodel.cn/"
    base_url: "https://open.bigmodel.cn/api/paas/v4/"
    env_key: "ZHIPU_API_KEY"
    tier: "tier2-cloud-free"
    default_model: "glm-4.7-flash"
    quota: "Completely Free Flash tier (200K ctx / 128K out)"
    bottleneck: "Concurrency cap; GLM-5.x line is billed (never call paid tiers on $0 balance)"
    effective_context: "200K"
    trains_on_data: "Standard free-tier logging"

  nvidia-nim:
    name: "NVIDIA NIM"
    url: "https://build.nvidia.com/"
    base_url: "https://integrate.api.nvidia.com/v1"
    env_key: "NVIDIA_API_KEY"
    tier: "tier2-cloud-free"
    default_model: "deepseek-ai/deepseek-v4.1-flash"
    quota: "~40 RPM Developer Prototyping Catalog"
    bottleneck: "Non-production license; MoE cold-start queues"
    effective_context: "128K"
    trains_on_data: "No (Prototyping terms)"

  openrouter-free:
    name: "OpenRouter (:free)"
    url: "https://openrouter.ai/"
    base_url: "https://openrouter.ai/api/v1"
    env_key: "OPENROUTER_API_KEY"
    tier: "tier2-cloud-free"
    default_model: "openrouter/free"
    quota: "20 RPM · 50 RPD ($0) -> 1,000 RPD (>=10 credits balance)"
    bottleneck: "Negative balance returns 402 even on :free; poll GET /api/v1/key"
    effective_context: "32K-128K (Host dependent)"
    trains_on_data: "Configurable via privacy header"

  groq-cloud:
    name: "Groq Cloud"
    url: "https://console.groq.com/"
    base_url: "https://api.groq.com/openai/v1"
    env_key: "GROQ_API_KEY"
    tier: "tier2-cloud-free"
    default_model: "qwen/qwen3.8-27b"
    quota: "LLMs: 30 RPM / 1K RPD / 8K TPM / 200K TPD | Whisper: 20 RPM / 2K RPD / 28.8K audio sec/day"
    bottleneck: "Strict 8,000 TPM wall on free LLMs; Llama 3.1/3.3 moved to Contact Sales"
    effective_context: "Capped at 8K TPM"
    trains_on_data: "No"

  cloudflare-workers-ai:
    name: "Cloudflare Workers AI"
    url: "https://developers.cloudflare.com/workers-ai/"
    base_url: "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/ai/v1"
    env_key: "CLOUDFLARE_API_TOKEN"
    tier: "tier2-cloud-free"
    default_model: "@cf/cloudflare/clef"
    quota: "10,000 Neurons/day free (resets 00:00 UTC)"
    bottleneck: "Legacy catalog hard-retired Nov 20, 2026 (HTTP 410); use for Clef/Clef-Omni/Clairic"
    effective_context: "64K (Clef)"
    trains_on_data: "No (Zero retention on Workers AI)"

  unsloth-local:
    name: "Unsloth Local Runtime (see Ch 02)"
    url: "https://github.com/unslothai/unsloth"
    base_url: "http://localhost:8000/v1"
    env_key: null
    tier: "tier1-local"
    default_model: "inkling-2-mini"
    quota: "Unlimited Local Hardware (16GB VRAM + 64GB RAM; OpenAI & Anthropic APIs)"
    bottleneck: "Local hardware envelope (see Ch 02)"
    effective_context: "Up to 1M"
    trains_on_data: "No (100% Air-Gapped Local)"

  pollinations:
    name: "Pollinations AI"
    url: "https://pollinations.ai/"
    base_url: "https://text.pollinations.ai/openai"
    env_key: null
    tier: "tier0-keyless"
    default_model: "openai"
    quota: "Keyless Zero-Auth Fair-Use IP Quota"
    bottleneck: "Shared public community capacity"
    effective_context: "Standard"
    trains_on_data: "Public endpoint"

forage_routes:
  coding-agent:
    description: "Autonomous Coding & Terminal CLI (~20K tok/step)"
    chain: ["google-ai-studio", "zhipu-bigmodel", "openrouter-free", "nvidia-nim", "unsloth-local", "pollinations"]
  repo-1m:
    description: "Massive Repo / Multi-PDF Ingestion (100K-1M tok)"
    chain: ["google-ai-studio", "zhipu-bigmodel", "unsloth-local"]
  deep-reason:
    description: "Frontier Logic, Math & Architecture"
    chain: ["nvidia-nim", "google-ai-studio", "openrouter-free", "unsloth-local", "pollinations"]
  fast-json:
    description: "Fast Small-Prompt Classification & Schema Output (<6K tok)"
    chain: ["groq-cloud", "google-ai-studio", "cloudflare-workers-ai", "unsloth-local", "pollinations"]
  decision-gate:
    description: "System-1 Non-Autoregressive Decisions, Extraction & Safety Gates"
    chain: ["google-ai-studio", "cloudflare-workers-ai", "unsloth-local"]
  voice-stt:
    description: "Real-Time Audio Transcription (Whisper-Large-v3)"
    chain: ["groq-cloud"]

sections:
  - heading: "1. Task-Routed Cloud Intelligence & Decision Matrix"
    headers: ["Task & Workload", "Primary Winner & Proof", "Free Gateway & Quota Pipe", "The Catch (`Gotcha` & Privacy)"]
    rows:
      - c1: "**Autonomous Coding & Everyday**<br><sub>Multi-file edits, Bash, MCP loops</sub>"
        c2: "**`Gemini 4 Hydrogen` / `3.8 Flash`**<br><sub>🏆 Nov 2026 fast successor (Everyday & Thinking · 1M ctx)</sub><br>**`GLM-4.7-Flash`** · `MIT`<br><sub>🏆 **79.5** τ²-Bench · 200K ctx / 128K out</sub>"
        c3: "[**Google AI Studio**](https://aistudio.google.com/)<br><sub><kbd>No Card</kbd> Free per-project + App Free/Plus/Pro/Ultra</sub><br>[**Z.ai BigModel**](https://open.bigmodel.cn/)<br><sub><kbd>No Card</kbd> Completely Free Flash tier</sub>"
        c4: "⚠️ **Z.ai Fix:** Only `glm-4.7-flash` is permanently free (`glm-5.x` is billed).<br>💡 **Cheap Cloud:** `Inkling 2 Mini` on OpenRouter (`io.net`) is **$0.08/M in, $0.35/M out**."
      - c1: "**Frontier Heavyweights (500B+)**<br><sub>MoE VLM & PhD reasoning</sub>"
        c2: "**`DeepSeek-V4.1-Flash`** · `552B`<br><sub>🏆 Frontier open VLM/coder (8B active)</sub><br>**`Nemotron-3.5-Super-VL`** · `120B`<br><sub>🏆 & `Inkling 2 Small` / `Kimi` via `:free`</sub>"
        c3: "[**NVIDIA NIM**](https://build.nvidia.com/)<br><sub><kbd>No Card</kbd> ~40 RPM Dev Catalog</sub><br>[**OpenRouter `:free`**](https://openrouter.ai/)<br><sub><kbd>10 Cr</kbd> Unlocks **1,000 RPD** (vs 50)</sub>"
        c4: "⚠️ **NIM** is prototyping-only with occasional MoE cold-start queues.<br>⚠️ **OpenRouter** returns `402` even on `:free` if balance goes negative."
      - c1: "**System-1 Decision & Extract**<br><sub>Single-pass probabilities ($0 out)</sub>"
        c2: "**`Gemini Decision 1`**<br><sub>🏆 Up to **1,000** typed questions/pass (multimodal)</sub><br>**`Clairic` / `Clef` / `Clef-Omni`**<br><sub>🏆 Zero-output extraction, 64-step forecasts, audio/video</sub>"
        c3: "[**Google AI Studio**](https://aistudio.google.com/)<br><sub><kbd>No Card</kbd> **200 RPM · 50K TPM · 10K RPD**</sub><br>[**Cloudflare Workers AI**](https://developers.cloudflare.com/workers-ai/)<br><sub><kbd>No Card</kbd> **10,000 Neurons/day** free</sub>"
        c4: "✅ **Zero Output Tokens Billed:** Ideal for agent safety gates, routing, and structured span extraction.<br>⚠️ Cloudflare retired legacy models Nov 20, 2026 (`HTTP 410`)."
      - c1: "**Fast Micro-Routers (<6K)**<br><sub>Sub-second JSON & small prompts</sub>"
        c2: "**`qwen/qwen3.8-27b`**<br><sub>🏆 Verified active on Groq free LPU</sub><br>**`gpt-oss-120b` / `gpt-oss-20b`**<br><sub>🏆 Ultra-fast structured transforms</sub>"
        c3: "[**Groq Cloud**](https://console.groq.com/)<br><sub><kbd>No Card</kbd> **30 RPM · 1K RPD · 200K TPD**</sub><br>[**Google AI Studio**](https://aistudio.google.com/)<br><sub><kbd>No Card</kbd> `4 Hydrogen` / `3.5 Flash-Lite`</sub>"
        c4: "⚠️ **Groq 8K TPM Wall:** Strictly for <6K token prompts (429s on coding agents). Llama 3.1/3.3 moved to Contact Sales."

  - heading: "2. Grounding, Search, Scraping & RAG Stack (100% Card-Free)"
    headers: ["Grounding Role", "Tool & Endpoint", "Verified Free Quota", "Why It Wins & Technical Gotcha"]
    rows:
      - c1: "**Keyless Web Scraper**<br><sub>Clean Markdown for LLM context</sub>"
        c2: "[**Firecrawl (`Keyless` & API)**](https://www.firecrawl.dev/)<br><sub>🏆 Lowest token bloat (**7,456** med. tok/task)</sub>"
        c3: "<kbd>Keyless</kbd> Official agent onboarding skill<br><sub>+ **500 credits** on signup</sub>"
        c4: "✅ Ships `agent-onboarding/SKILL.md` for zero-key foraging.<br>⚠️ Keyless mode is IP-rate-limited; pass API key for burst jobs."
      - c1: "**Zero-SDK URL / PDF Reader**<br><sub>Instant prefix conversion</sub>"
        c2: "[**Jina Reader (`r.jina.ai`)**](https://jina.ai/reader/)<br><sub>🏆 Zero-install URL-to-Markdown</sub>"
        c3: "<kbd>Keyless</kbd> Free rate-limited prefix<br><sub>+ **10,000,000 free tokens** w/ API key</sub>"
        c4: "✅ Prepend `https://r.jina.ai/` to any URL/PDF or `https://s.jina.ai/?q=` for keyless search."
      - c1: "**Neural & Deep Agent Search**<br><sub>Semantic web retrieval</sub>"
        c2: "[**Exa 3.0 (`Lite` / `Deep`)**](https://exa.ai/)<br><sub>🏆 Built natively for autonomous agents</sub>"
        c3: "<kbd>No Card</kbd> **$10/mo recurring credits**<br><sub>+ $10 bonus (**10 QPS** search / **100 QPS** contents)</sub>"
        c4: "✅ Resets 1st of every month (~2,500 Lite searches) + supports **50 concurrent agent runs**."
      - c1: "**Pre-Chunked RAG Search**<br><sub>Factual snippet injection</sub>"
        c2: "[**Tavily Search API**](https://tavily.com/)<br><sub>🏆 Skips custom HTML chunking pipelines</sub>"
        c3: "<kbd>No Card</kbd> **1,000 credits/mo forever**<br><sub>+ Keyless mode for Hermes Agent</sub>"
        c4: "✅ Pre-scored context chunks ready for prompt injection.<br>⚠️ `advanced` depth costs 2 credits vs 1 for `basic`."
      - c1: "**Embeddings & Reranking**<br><sub>Two-stage vector + probability filter</sub>"
        c2: "[**Cohere `Embed 5` & `Rerank 5`**](https://cohere.com/)<br><sub>🏆 Shared `Pro`/`Fast` embedding space</sub>"
        c3: "<kbd>No Card</kbd> **1,000 calls/mo** (Trial Key)<br><sub>10 Rerank/min · 20 Chat/min</sub>"
        c4: "✅ Index w/ `Embed 5 Pro`, query w/ `Fast` (98.4% retention), rerank via `Rerank 5` (32K ctx, JSON/YAML)."
      - c1: "**Academic & Paper Graph**<br><sub>Citations, abstracts, open PDFs</sub>"
        c2: "[**OpenAlex**](https://openalex.org/) + [**arXiv API**](https://arxiv.org/help/api/)<br><sub>🏆 250M+ scholarly works & citations</sub>"
        c3: "<kbd>Keyless</kbd> **100,000 requests/day**<br><sub>100% free forever</sub>"
        c4: "✅ Pass `?mailto=you@domain.com` in OpenAlex URLs to enter the fast polite pool with zero auth keys."

drawers:
  - summary: "Click to expand Cloud Foraging & Keyless Grounding Snippets"
    lang: "bash"
    code: |
      # Auto-detect active cloud keys, local server, or keyless Pollinations fallback
      python scripts/build.py forage coding-agent
      python scripts/build.py forage decision-gate

      # Keyless URL-to-Markdown (Jina) & OpenAlex Polite Pool (100K/day Free)
      curl -s "https://r.jina.ai/https://example.com" | head -n 30
      curl -s "https://api.openalex.org/works?search=harness+adapters+rl&filter=is_oa:true&per-page=3&mailto=agent@localhost"
