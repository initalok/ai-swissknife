decisions:
  - id: adr-why-pi-and-opencode
    title: "Pair OpenCode (Newcomer Anchor) with Pi (Flagship Developer Kernel)"
    status: accepted
    date: "2026-11-28"
    job: "Give newcomers safe, frictionless local coding on day one while giving developers a minimal, infinitely mod-able harness."
    anchor_ids: [pi, opencode]
    slot_ids: [dev-harness, newcomer-local-harness]
    alternatives: ["Google Antigravity", "Hermes Agent", "DeepSeek Harness (dsh)", "Claude Code"]
    rationale: "OpenCode wins beginner onboarding with 1-line install, built-in per-action approval prompts, and offline share-disabled mode. Pi wins as our long-term developer anchor because it is a minimal loop you own, ships built-in /llama router support and /tree DAG branching, achieves the highest HF RL LoRA lift (39.2% -> 64.7% SWE-Pro hard-51), and scales cleanly across an optional 6-rung ricing ladder."
    exceptions:
      - "Start with Google Antigravity if you want a $0 zero-install cloud IDE/CLI."
      - "Choose Hermes Agent if you want an always-on self-improving personal daemon with native messaging out of the box."
      - "Choose DeepSeek Harness (dsh) if you want a desktop/web platform where the core agent loop itself is a swappable plugin."
    reversal_trigger: "Another MIT-licensed harness matches Pi's transparency, built-in llama.cpp/LoRA ecosystem, and modular durability with lower operational friction."

  - id: adr-why-qwen38-27b
    title: "Standardize Local Coding on Frozen Qwen3.8-27B + Hot-Swappable LoRAs"
    status: accepted
    date: "2026-11-28"
    job: "Deliver reliable local coding, vision, and agentic tool use inside 16GB VRAM or 32GB+ Apple Silicon without PCIe bottlenecks."
    anchor_ids: [qwen3.8-27b]
    slot_ids: [local-mature-coder]
    alternatives: ["Inkling 2 Mini (26.4B Looped MoE)", "Qwen3-Coder-Next (80B-A3B)", "Gemma 4 (12B / 26B)", "Dense 70B models"]
    rationale: "At IQ4_XS (~14.5 GB) with Q8 KV cache, Qwen3.8-27B stays 100% resident in 16GB VRAM and acts as one frozen backbone for multiple lightweight adapters: HF's pi LoRA lifted reproduced TB2.1 from 39% -> 55% pass@1 while cutting tokens nearly in half (2.9K -> 1.5K/task), and 26 MB abliterated LoRAs share the exact same base file."
    exceptions:
      - "On 8GB-12GB student laptops, use $0 Cloud or Gemma 4 12B (~8.5 GB) instead of OOMing on a 27B checkpoint."
      - "On 16GB VRAM + 64GB DDR5 workstations needing deeper multi-file MoE capacity, add Qwen3-Coder-Next (80B-A3B)."
      - "For local audio understanding, use Gemma 4 12B."
    reversal_trigger: "An Apache-2.0 successor (such as an open-weight Qwen4 <= 32B or mature Inkling follow-up) beats adapted Qwen3.8-27B inside 16GB VRAM with stable runtime support."

  - id: adr-why-llama-cpp-and-mlx
    title: "Use llama.cpp (NVIDIA/Cross-Platform) & MLX (Apple Silicon) Over Ollama Defaults"
    status: accepted
    date: "2026-11-28"
    job: "Serve local GGUF and unified-memory checkpoints with explicit context lengths, hybrid MoE control, and runtime LoRA loading."
    anchor_ids: [llama-cpp, mlx-lm]
    slot_ids: [local-runtime]
    alternatives: ["Ollama", "vLLM", "LM Studio", "ik_llama.cpp"]
    rationale: "llama.cpp exposes explicit context flags (-c), sparse MoE offloading (--n-cpu-moe), runtime --lora loading, and router mode (llama serve) integrated natively into Pi. Apple MLX beats llama.cpp by 46%-3x on Apple Silicon unified memory. Together they avoid Ollama's silent 4,096-token default context trap below 24 GiB VRAM and reported /v1 hangs on qwen3.8:27b."
    exceptions:
      - "Use LM Studio + LM Link when you want a zero-config GUI or zero-VPN home GPU sharing."
      - "Use vLLM on multi-user Linux servers with 48GB+ dedicated VRAM."
    reversal_trigger: "Ollama defaults to agent-safe context sizes (>=32K) and resolves /v1 tool-calling stability, or a unified engine surpasses both llama.cpp and MLX."

  - id: adr-why-wangp-and-comfyui
    title: "Split Local Media Into Turnkey Low-VRAM (WanGP) vs. Programmable Agent Engine (ComfyUI + MCP)"
    status: accepted
    date: "2026-11-28"
    job: "Give newcomers an easy 6-16GB all-in-one local media studio while giving developers an agent-controllable node-graph server."
    anchor_ids: [wangp, comfyui, comfy-mcp, wan-2.2]
    slot_ids: [turnkey-media, agent-media-mcp]
    alternatives: ["ComfyUI alone", "Separate standalone video/image/TTS repos", "Closed cloud video APIs (Wan 3.0)"]
    rationale: "Head-to-head benchmarks show WanGP holding video generation to 5.9-14.3 GiB VRAM where ComfyUI peaks at 22.7-23.5 GiB, with guided installers starting at 6 GB VRAM. Meanwhile, Comfy-Org/ComfyUI (v0.46+) plus first-party comfy-mcp (Nov 2026) and artokun/comfyui-mcp excel as a programmable node-graph server driven remotely by Pi over Tailscale. Wan 2.2 provides an Apache-2.0 commercial-safe base."
    exceptions:
      - "For commercial still graphics, use Apache-2.0 FLUX.2 Klein rather than non-commercial Qwen-Image-2.1."
      - "On Apple Silicon Macs, avoid heavy local video on MPS; route comfy-mcp to a remote NVIDIA PC or Comfy Cloud."
    reversal_trigger: "ComfyUI matches WanGP's out-of-the-box 6-8GB VRAM memory management, or a newer permissive open video model supersedes Wan 2.2 on 16GB cards."

  - id: adr-why-google-cloud
    title: "Anchor Zero-Card Cloud on Google AI Studio (Gemini 4 Hydrogen) & Antigravity"
    status: accepted
    date: "2026-11-28"
    job: "Provide genuinely usable $0 cloud compute for beginners, students, and multi-step coding agents without a credit card."
    anchor_ids: [google-ai-studio, google-antigravity]
    slot_ids: [cloud-flagship, newcomer-cloud-ide]
    alternatives: ["Z.ai BigModel", "OpenRouter :free", "Groq Cloud", "NVIDIA NIM"]
    rationale: "Real coding agents consume ~20,000 input tokens per step across ~15 steps (~300,000 tokens/task). Groq's 8K TPM cap fails Step 1 and unverified OpenRouter (50 RPD) runs out in ~3 tasks. Google AI Studio's Free Tier (gemini-4-hydrogen, 1M unified context) plus Antigravity's $0 Individual tier is the only zero-card entry that sustains real agent loops out of the box."
    exceptions:
      - "Never send private repos or credentials to free cloud tiers; switch to local Qwen3.8-27B."
      - "Use Groq specifically for fast <6K-token routers and free Whisper-Large-v3 speech transcription."
    reversal_trigger: "Google requires a credit card on AI Studio Free Tier or reduces free token throughput below multi-step coding agent viability."

  - id: adr-why-mobile-hitl
    title: "Treat Mobile Strictly as Human Communicator & HITL Steering Surface"
    status: accepted
    date: "2026-11-28"
    job: "Keep human judgment, approvals, voice intent, and camera capture in your pocket while heavy compute stays on Mac/PC/Cloud."
    anchor_ids: [pi-mobile-voice, pi-mobile-android, pi-durable-telegram]
    slot_ids: [mobile-hitl-primary]
    alternatives: ["Brute-force on-phone LLM apps", "Publicly exposed web terminals"]
    rationale: "Running 27B coding models or 1080p video on phone batteries yields poor speed and thermals. Using phones for what they excel at—push pings (ntfy), async messaging HITL (Telegram long-poll), and E2E Tailscale live steering (pi-mobile Voice Mode / Android Compose)—eliminates babysitting your terminal while keeping heavy weights on desktop silicon."
    exceptions:
      - "Use lightweight native dictation, camera photos, and OS share-sheets on mobile strictly as inputs into your home durable session."
    reversal_trigger: "Mobile NPUs and unified RAM sustain 16GB+ workstation-class memory bandwidth without thermal throttling."

  - id: adr-why-tailscale-and-lm-link
    title: "Connect Compute Worlds via Loopback + Tailscale Serve (Dev) & LM Link (Zero-Config)"
    status: accepted
    date: "2026-11-28"
    job: "Bridge Mac mini, discrete GPU PC, and mobile HITL clients securely with zero open router ports."
    anchor_ids: [tailscale-serve, lm-link]
    slot_ids: [interconnect-fabric]
    alternatives: ["Router port-forwarding", "Binding 0.0.0.0 on LAN", "Raw WireGuard / Headscale"]
    rationale: "Binding local AI services strictly to 127.0.0.1 and publishing through tailscale serve provides automatic HTTPS, zero exposed LAN ports, and device ACL tags. LM Link (powered by tsnet) gives newcomers a zero-VPN bridge to borrow a home desktop GPU from a thin laptop."
    exceptions:
      - "Self-hosted purists avoiding any third-party coordination server should run raw WireGuard or self-hosted Headscale."
    reversal_trigger: "LM Link leaves free preview with restrictive pricing (affecting newcomers), or an open zero-trust mesh standard supersedes Tailscale."

  - id: adr-why-sandboxes-and-safety
    title: "Layer OS/VM Isolation (gondolin / nono) with Tool-Call Auditing (safeagents / Laya)"
    status: accepted
    date: "2026-11-28"
    job: "Prevent credential exfiltration and destructive shell mistakes when running autonomous or unfiltered local agents."
    anchor_ids: [safeagents, gondolin, nono, laya-05]
    slot_ids: [runtime-safety]
    alternatives: ["Running agents unsandboxed", "Docker-only containers", "Manual human approval of every read-only command"]
    rationale: "Pi intentionally omits built-in approval prompts, and abliterated LoRAs cannot refuse destructive commands. gondolin provides lightweight libkrun micro-VMs with host placeholder secret injection (the VM never sees real tokens); nono provides zero-VM macOS Seatbelt/Linux Landlock for native builds; safeagents + Laya 0.5 audit tool calls in ~10-20ms without occupying GPU VRAM."
    exceptions:
      - "Beginners starting in OpenCode on disposable sample repos can rely on OpenCode's built-in per-action prompts before adopting full sandboxes."
    reversal_trigger: "OS vendors ship native, zero-config capability sandboxes with built-in HTTP secret injection directly in macOS and Linux shells."

  - id: adr-why-markdown-memory
    title: "Keep Long-Term Agent Memory in Plain Markdown Vaults with KV-Cache-Stable Injection"
    status: accepted
    date: "2026-11-28"
    job: "Build durable personal and project memory that humans can read, edit, and sync across devices without destroying local inference speed."
    anchor_ids: [obsidian-skills, qmd-search, pi-obsidian-memory]
    slot_ids: [knowledge-vault]
    alternatives: ["Opaque cloud memory SaaS", "Per-turn system-prompt mutation", "Synced binary vector databases"]
    rationale: "Plain Markdown (AGENTS.md, SKILL.md, Obsidian vaults via obsidianmd/obsidian-skills) stays inspectable in Git and portable across 46+ agents. Pairing local tobi/qmd retrieval with KV-cache-stable session snapshots prevents llama.cpp and MLX from re-prefilling the entire prompt every turn, while keeping vector indexes machine-local prevents sync corruption."
    exceptions:
      - "Large multi-user engineering teams may still need a shared server-backed wiki or issue tracker alongside repo-local AGENTS.md."
    reversal_trigger: "Local inference runtimes support arbitrary non-prefix KV-cache reuse without prefill latency penalties."

  - id: adr-000-pi-llama-extension
    title: "Use huggingface/pi-llama Extension for Local llama.cpp in Pi"
    status: superseded
    superseded_by: adr-why-pi-and-opencode
    date: "2026-11-09"
    job: "Connect Pi Coding Agent to local llama.cpp servers."
    anchor_ids: []
    slot_ids: []
    alternatives: ["Manual OpenAI provider config"]
    rationale: "Historically required an external extension before native /llama router support landed in Pi core; archived upstream on Nov 9, 2026."
    exceptions:
      - "None; use Pi's built-in /llama integration."
    reversal_trigger: "Superseded—preserved strictly as immutable architectural history."
