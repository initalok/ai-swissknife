guides:
  - id: coding-and-apps
    title: "Coding & Apps"
    summary: "End-to-end engineering workflow pairing verified models and harnesses with live documentation lookup, browser QA, and Apple mobile build tools."
    last_verified: "2026-11-27"
    decay_class: operational
    constraints:
      capabilities: [coding]
      privacy: any
      require_guard: true
    pin_entries: []
    tools:
      - id: playwright-mcp
        name: "Microsoft Playwright MCP"
        url: "https://github.com/microsoft/playwright-mcp"
        summary: "Browser accessibility-tree automation with Planner, Generator, and Healer testing agents."
      - id: context7
        name: "Upstash Context7 (ctx7 & @upstash/context7-pi)"
        url: "https://github.com/upstash/context7"
        summary: "Injects live version-matched library documentation directly into coding agents."
      - id: mobile-build-mcp
        name: "Sentry MobileBuildMCP"
        url: "https://github.com/getsentry/MobileBuildMCP"
        summary: "Builds Apple targets, runs XCTest suites, and attaches LLDB (formerly XcodeBuildMCP)."
      - id: superpowers
        name: "obra/superpowers"
        url: "https://github.com/obra/superpowers"
        summary: "15 workflow skills enforcing Brainstorm -> Spec -> Red/Green TDD -> Verification before completion."
    steps:
      - "Choose your inference layer: zero-card Google AI Studio (gemini-4-hydrogen) or local Qwen3.8-27B + HF Harness Adapter."
      - "Add an explicit instruction in your repository AGENTS.md telling the agent to check Context7 before using fast-moving 2026 framework APIs."
      - "Wrap shell-capable harnesses behind safeagents (and optionally Laya 0.5) before launching multi-hour autonomous runs."
      - "Verify web UI behavior with Playwright MCP or Apple builds and XCTest suites with Sentry MobileBuildMCP."
    limitations:
      - "Pin local Context7 servers to >= 2.1.3 (CVE-2026-75130); Playwright accessibility snapshots cannot inspect closed Shadow DOM."
      - "MobileBuildMCP stops at Apple builds and simulators; physical USB Android/iOS UI testing requires separate device tooling."

  - id: research-and-writing
    title: "Research & Writing"
    summary: "High-precision literature synthesis combining open academic graphs, semantic search, and cited draft generation."
    last_verified: "2026-11-27"
    decay_class: operational
    constraints:
      capabilities: [research]
      privacy: any
      require_guard: false
    pin_entries: []
    tools:
      - id: gpt-researcher
        name: "GPT Researcher"
        url: "https://github.com/assafelovic/gpt-researcher"
        summary: "Open-source research synthesizer (gptr-mcp and skill) covering both web sources and local PDF/CSV folders."
      - id: deerflow
        name: "DeerFlow 2.0"
        url: "https://github.com/bytedance/deer-flow"
        summary: "Open-source deep research harness running inside an isolated Docker sandbox."
    steps:
      - "Gather primary scholarly works and DOIs from OpenAlex (polite pool) and current technical documentation via Exa 3.0 or Firecrawl."
      - "Run GPT Researcher or DeerFlow 2.0 across retrieved web pages and local PDF/CSV source folders."
      - "Audit every cited claim, date, and quantitative figure against primary sources before publishing."
    limitations:
      - "Never treat autonomous research syntheses as publication-ready without checking primary DOIs and URLs manually."

  - id: local-media-studio
    title: "Local Media Studio"
    summary: "Unified local creative pipeline for 16GB video synthesis, transparent RGBA image editing, code-driven motion graphics, NLE automation, and browser voiceovers."
    last_verified: "2026-11-27"
    decay_class: operational
    constraints:
      capabilities: [media]
      privacy: any
      require_guard: false
    pin_entries: [wangp, qwen-image-2.1, wan-2.2]
    tools:
      - id: hyperframes
        name: "HeyGen Hyperframes"
        url: "https://github.com/heygen-com/hyperframes"
        summary: "Programmatic HTML-to-MP4 studio ideal for crisp UI demos, explainers, and launch motion graphics."
      - id: davinci-mcp-free
        name: "DaVinci Resolve MCP (Free & Studio Bridge)"
        url: "https://github.com/hiteshK03/davinci-resolve-mcp"
        summary: "Community internal script bridge exposing 155/162 DaVinci Resolve timeline, color, and audio tools even on the Free edition."
      - id: phonon-31m
        name: "Gradium Phonon 31M WebGPU TTS"
        url: "https://github.com/blixt/phonon"
        summary: "64.5 MB Apache-2.0 voice synthesis running directly in browser WebGPU at 4.9ms first-audio latency."
    steps:
      - "Generate deterministic product demos and data graphics in code using HeyGen Hyperframes."
      - "Produce local AI footage inside 5.9-15 GB VRAM using WanGP v20.12 with Wan 2.2 (Apache-2.0) or Qwen-Image-2.1 (non-commercial)."
      - "Automate timeline cuts and grading via DaVinci Resolve MCP and render fast English voiceovers locally with Phonon 31M."
    limitations:
      - "Qwen-Image-2.1 is licensed non-commercially; swap to Apache-2.0 FLUX.2 Klein for commercial graphics."
      - "Official external DaVinci Resolve scripting remains Studio-only; verify community internal bridge compatibility after Resolve updates."
