      runs_on: [gpu-pc]
    meta:
      license: Apache-2.0
      upstream_docs_url: "https://huggingface.co/blog/harness-adapters-at-scale"
      eval_tables:
        - title: "TB2.1 Difficulty-Filtering Ablation (Qwen3.8-27B · LoRA AsyncGRPO · 32 tasks/arm · 8xH200 · Base TB2.1: 35.9%)"
          headers: ["Experimental Arm", "Task Filtering Rule", "Steps Completed", "Train Reward (Steps 1-5 -> Last 5)"]
          rows:
            - ["A1 Unvalidated", "24 accepted + 8 failed openenv validate", "40 (timed out at step 48)", "0.64 -> 0.67"]
            - ["A2 Validated", "32 validated, no difficulty filter", "50 (completed)", "0.56 -> 0.70"]
            - ["A3 Unqualified", "32 validated base always or never solves", "25 (timed out at step 26)", "0.60 -> 0.63"]
            - ["A4 Qualified", "32 validated base solves sometimes", "50 (completed)", "0.62 -> 0.81"]
    limitations:
      - "Requires all-linear LoRA, LR 2e-5 (1e-4 collapses rollouts), tool bonus 0.1, and excluding all-pass/all-fail tasks."

