entries:
  - id: qwen3.8-27b
    kind: model
    name: "Qwen3.8-27B (Dense Vision + Text)"
    summary: "Apache-2.0 27B dense model serving as the primary 16GB VRAM and Apple Silicon coding backbone, hosting both Hugging Face's RL harness adapters and compact uncensored LoRAs on one frozen file."
    when_to_use: "Daily-driver local coding, strict instruction following, and single-backbone multi-LoRA serving."
    evidence_tier: primary-eval
    lifecycle: mature
    decay_class: stable
    last_verified: "2026-11-28"
    url: "https://huggingface.co/Qwen/Qwen3.8-27B"
    tags: [local-mature, tier-16-24gb]
    capabilities: [coding, research, reverse-eng, social, unfiltered]
    relations:
      runs_on: [gpu-pc, mac]
    meta:
      license: Apache-2.0
      footprint: "14.5 GB (IQ4_XS, Zone 1 16GB VRAM) / ~16 GB (Mac MLX 4-bit)"
      launch_recipe: "llama-server -m Qwen3.8-27B-IQ4_XS.gguf -ngl 99 -fa on -c 32768 -ctk q8_0 -ctv q8_0 --host 127.0.0.1 --port 8080"
      mac_launch_recipe: "mlx_lm.server --model netprojects/Qwen3.8-27B-super-adapter-MLX-6bit --host 127.0.0.1 --port 8080"
      sanity_check: "curl -s http://127.0.0.1:8080/health"
    limitations:
      - "On 16GB GPUs, keep quantization at IQ4_XS with Q8 KV cache so weights never spill over PCIe."
      - "Avoid Ollama's /v1/chat/completions endpoint with qwen3.8:27b due to reported hangs; use llama-server or mlx_lm.server."
      - "Not suited for 8GB-12GB student laptops; use $0 Cloud or Gemma 4 12B on smaller hardware."

  - id: qwen3-coder-next
    kind: model
    name: "Qwen3-Coder-Next (80B-A3B Sparse MoE)"
    summary: "Sparse 512-expert Mixture-of-Experts coding model activating only 3B parameters per token, making 80B-class capacity practical in 16GB VRAM + 64GB DDR5 hybrid mode."
    when_to_use: "Deeper multi-file repository reasoning on 16GB GPU + 64GB RAM workstations or 64GB+ Macs."
    evidence_tier: official-docs
    lifecycle: mature
    decay_class: stable
    last_verified: "2026-11-28"
    url: "https://huggingface.co/unsloth/Qwen3-Coder-Next-GGUF"
    tags: [local-mature, tier-hybrid-80gb]
    capabilities: [coding, reverse-eng, game-dev]
    relations:
      runs_on: [gpu-pc, mac]
    meta:
      license: Apache-2.0
      footprint: "49 GB (UD-Q4_K_XL, Zone 2 16GB VRAM + 64GB RAM)"
      launch_recipe: "GGML_CUDA_GRAPH_OPT=1 llama-server -m Qwen3-Coder-Next-UD-Q4_K_XL.gguf -ngl 99 -fa on -c 120000 --load-mode none --n-cpu-moe 29 -ctk q8_0 -ctv q8_0 --host 127.0.0.1 --port 8080 --temp 0"
    limitations:
      - "Keep -ngl 99 so Attention and KV cache stay in GPU VRAM; offload cold experts only via --n-cpu-moe."

