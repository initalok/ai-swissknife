[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-swissknife"
version = "5.0.0b1"
description = "Headless catalog, live health verifier, and Diataxis documentation compiler for AI Swiss Knife."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31.0",
]

[project.scripts]
swissknife = "swissknife.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
