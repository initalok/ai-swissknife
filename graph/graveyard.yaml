cloud:
  - name: "Cerebras Cloud Legacy Free Tier"
    match_pattern: "cerebras.ai"
    reason: "Confirmed Nov 18, 2026: no renewing free tier; $5 / 30-day credit requires a payment method."
    replaced_by: google-ai-studio
  - name: "Mistral La Plateforme Free Experiment Tier"
    match_pattern: "api.mistral.ai"
    reason: "Billing docs require pay-as-you-go activation for API keys."
    replaced_by: zhipu-bigmodel
  - name: "Gemini 2.5 Pro & 2.5 Flash"
    match_pattern: "gemini-2.5-pro"
    reason: "Retiring Dec 1, 2026; superseded by Gemini 4 Hydrogen & 3.8 Flash."
    replaced_by: google-ai-studio
  - name: "GitHub Models (Azure Inference Endpoint)"
    match_pattern: "inference.ai.azure.com"
    reason: "Officially retired July 30, 2026; endpoints are dead."
    replaced_by: openrouter-free
  - name: "Brave Search API Free Tier"
    match_pattern: "brave.com/search/api"
    reason: "Requires a credit card on file."
    replaced_by: exa-search

local:
  - name: "Wan 3.0, Wan 2.6, & FLUX 3 Video"
    match_pattern: "wan 3.0"
    reason: "Closed cloud APIs with no published open weights."
    replaced_by: wan-2.2
  - name: "Inkling 2 Small (594B) & Inkling Flagship (975B)"
    match_pattern: "inkling 2 small"
    reason: "Require 354-600 GB memory (cloud/Tinker API only)."
    replaced_by: inkling-2-mini
  - name: "GLM-5.3-Flash (320B) & Kimi K2.7-Code (1T)"
    match_pattern: "glm-5.3-flash"
    reason: "Exceed 16GB VRAM + 64GB RAM hardware ceiling."
    replaced_by: qwen3-coder-next
  - name: "Qwen3.8-Flash-Next at UD-Q2_K_XL (79.6 GB)"
    match_pattern: "qwen3.8-flash-next-ud-q2_k_xl"
    reason: "Leaves zero headroom for OS, MTP weights, and KV cache on 16GB+64GB."
    replaced_by: qwen3.8-27b
