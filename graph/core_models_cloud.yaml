forage_routes:
  coding-agent:
    chain: [google-ai-studio, zhipu-bigmodel, openrouter-free, nvidia-nim, pollinations]
  repo-1m:
    chain: [google-ai-studio, zhipu-bigmodel]
  deep-reason:
    chain: [nvidia-nim, google-ai-studio, openrouter-free, pollinations]
  fast-json:
    chain: [groq-cloud, google-ai-studio, cloudflare-workers-ai, pollinations]
  decision-gate:
    chain: [google-ai-studio, cloudflare-workers-ai]
  voice-stt:
    chain: [groq-cloud]

nodes:
  # --- 6 VERIFIED NO-CARD CLOUD GATEWAYS + KEYLESS FALLBACK ---
  - id: google-ai-studio
    kind: gateway
    name: "Google AI Studio (Gemini 4 Hydrogen & 3.8 Flash)"
    lifecycle: operational
    decay_class: volatile
    last_verified: "2026-11-27"
    url: "https://aistudio.google.com/"
    env_key: GEMINI_API_KEY
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    default_model: "gemini-3.8-flash"
    quota: "No Card: Free per-project (4 Hydrogen, 3.8 Flash 1M ctx) + Decision 1 (200 RPM / 10K RPD)"
    capabilities: [coding, research, media, social]
    edges:
      runs_on: [zero-card-cloud]
    proof:
      - "Gemini 4 Hydrogen (Everyday & Thinking) launched Nov 2026 across Free, Plus, Pro & Ultra"
      - "Gemini Decision 1 evaluates up to 1,000 typed questions per prefill pass with $0 output tokens"
    gotchas:
      - "Gemini 2.5 retires Dec 1, 2026; 4 Argon/Carbon/Neon, Batch, & Search Grounding are paid-only."
      - "Free tier prompts may be logged outside EU/UK/CH; redact sensitive PII."

  - id: zhipu-bigmodel
    kind: gateway
    name: "Z.ai BigModel (GLM-4.7-Flash)"
    lifecycle: operational
    decay_class: volatile
    last_verified: "2026-11-27"
    url: "https://open.bigmodel.cn/"
    env_key: ZHIPU_API_KEY
    base_url: "https://open.bigmodel.cn/api/paas/v4/"
    default_model: "glm-4.7-flash"
    quota: "No Card: Completely Free Flash tier (200K ctx / 128K out)"
    capabilities: [coding]
    edges:
      runs_on: [zero-card-cloud]
    proof:
      - "GLM-4.7-Flash (MIT) scores 79.5 tau2-Bench with a 200K context window"
    gotchas:
      - "Only glm-4.7-flash is permanently free; the GLM-5.x line is billed and fails on $0 balances."

  - id: nvidia-nim
    kind: gateway
    name: "NVIDIA NIM Developer Catalog"
    lifecycle: operational
    decay_class: volatile
    last_verified: "2026-11-27"
    url: "https://build.nvidia.com/"
    env_key: NVIDIA_API_KEY
    base_url: "https://integrate.api.nvidia.com/v1"
    default_model: "deepseek-ai/deepseek-v4.1-flash"
    quota: "No Card: ~40 RPM Developer Prototyping Catalog"
    capabilities: [coding, research]
    edges:
      runs_on: [zero-card-cloud]
    proof:
      - "Hosts 552B DeepSeek-V4.1-Flash and Nemotron-3.5-Super-VL serverless"
    gotchas:
      - "Prototyping-only license with occasional cold-start queues on giant MoEs."

  - id: openrouter-free
    kind: gateway
    name: "OpenRouter (:free)"
    lifecycle: operational
    decay_class: volatile
    last_verified: "2026-11-27"
    url: "https://openrouter.ai/"
    env_key: OPENROUTER_API_KEY
    base_url: "https://openrouter.ai/api/v1"
    default_model: "openrouter/free"
    quota: "20 RPM, 50 RPD ($0) -> 1,000 RPD (>=10 credits balance)"
    capabilities: [coding, research]
    edges:
      runs_on: [zero-card-cloud]
    proof:
      - "Aggregates free frontier hosts; also offers Inkling 2 Mini via io.net at $0.08/M in, $0.35/M out"
    gotchas:
      - "Negative balance returns HTTP 402 even on :free routes; poll GET /api/v1/key."

  - id: groq-cloud
    kind: gateway
    name: "Groq Cloud LPU"
    lifecycle: operational
    decay_class: volatile
    last_verified: "2026-11-27"
    url: "https://console.groq.com/"
    env_key: GROQ_API_KEY
    base_url: "https://api.groq.com/openai/v1"
    default_model: "qwen/qwen3.8-27b"
    quota: "No Card: LLMs 30 RPM / 1K RPD / 8K TPM; Whisper 2K RPD / 28.8K audio sec/day"
    capabilities: [fast-json, media]
    edges:
      runs_on: [zero-card-cloud]
    proof:
      - "Verified active free LLMs: qwen/qwen3.8-27b, gpt-oss-120b, gpt-oss-20b, and Whisper-Large-v3"
    gotchas:
      - "Strict 8,000 TPM wall causes 429s on coding agents; keep prompts under 6K tokens or use for STT."

  - id: cloudflare-workers-ai
    kind: gateway
    name: "Cloudflare Workers AI (Clef & Clairic)"
    lifecycle: operational
    decay_class: volatile
    last_verified: "2026-11-27"
    url: "https://developers.cloudflare.com/workers-ai/"
    env_key: CLOUDFLARE_API_TOKEN
    base_url: "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/ai/v1"
    default_model: "@cf/cloudflare/clef"
    quota: "No Card: 10,000 Neurons/day free (resets 00:00 UTC)"
    capabilities: [decisions]
    edges:
      runs_on: [zero-card-cloud]
    proof:
      - "Non-autoregressive Clef, Clef-Omni (audio/video), and Clairic (zero-output typed extraction)"
    gotchas:
      - "Legacy Workers AI catalog models were hard-retired Nov 20, 2026 (HTTP 410)."

  - id: pollinations
    kind: gateway
    name: "Pollinations AI (Keyless Fallback)"
    lifecycle: operational
    decay_class: stable
    last_verified: "2026-11-27"
    url: "https://pollinations.ai/"
    env_key: null
    base_url: "https://text.pollinations.ai/openai"
    default_model: "openai"
    quota: "Keyless Zero-Auth Fair-Use IP Quota (Text, FLUX Image, Audio)"
    capabilities: [coding]
    edges:
      runs_on: [zero-card-cloud]
    proof:
      - "Instant zero-key fallback for sandbox chat and FLUX REST images"
    gotchas:
      - "Shared public endpoint; never transmit credentials or sensitive data."

  # --- 4 CORE GROUNDING & RAG APIS ---
  - id: firecrawl
    kind: tool
    domain: grounding
    name: "Firecrawl (Keyless Skill & API)"
    lifecycle: operational
    decay_class: operational
    last_verified: "2026-11-27"
    url: "https://www.firecrawl.dev/"
    quota: "Keyless onboarding skill + 500 credits on signup"
    capabilities: [research]
    edges:
      runs_on: [zero-card-cloud]
    proof:
      - "Lowest web-scraping token bloat on OpenBenchmarks (7,456 median tokens/task)"
    gotchas:
      - "Keyless mode is IP-rate-limited; pass API key for burst crawls."

  - id: jina-reader
    kind: tool
    domain: grounding
    name: "Jina Reader (r.jina.ai / s.jina.ai)"
    lifecycle: mature
    decay_class: stable
    last_verified: "2026-11-27"
    url: "https://jina.ai/reader/"
    quota: "Keyless prefix + 10M free tokens with API key"
    capabilities: [research]
    edges:
      runs_on: [zero-card-cloud]
    proof:
      - "Zero-SDK URL/PDF-to-Markdown conversion and keyless search prefix"
    gotchas:
      - "Rate-limited without API key on high-frequency loops."

  - id: exa-search
    kind: tool
    domain: grounding
    name: "Exa 3.0 Neural Search"
    lifecycle: operational
    decay_class: volatile
    last_verified: "2026-11-27"
    url: "https://exa.ai/"
    quota: "No Card: $10/mo recurring credits + $10 bonus (10 QPS search)"
    capabilities: [research]
    edges:
      runs_on: [zero-card-cloud]
    proof:
      - "Resets 1st of every month (~2,500 Lite searches) with 50 concurrent agent runs"
    gotchas:
      - "Deep research mode burns monthly credits faster than Lite mode."

  - id: openalex
    kind: tool
    domain: grounding
    name: "OpenAlex Academic Graph"
    lifecycle: mature
    decay_class: stable
    last_verified: "2026-11-27"
    url: "https://openalex.org/"
    quota: "Keyless: 100,000 requests/day forever"
    capabilities: [research]
    edges:
      runs_on: [zero-card-cloud]
    proof:
      - "250M+ scholarly works, citation graphs, and open-access PDFs"
    gotchas:
      - "Pass ?mailto=you@domain.com in URLs to enter the fast polite pool."

  # --- LOCAL AI: TRACK A MATURE RICED vs TRACK B CUTTING-EDGE + DECISIONS + MEDIA ---
  - id: qwen3.8-27b
    kind: model
    name: "Qwen3.8-27B (Dense Vision+Text Backbone)"
    lifecycle: mature
    decay_class: stable
    last_verified: "2026-11-27"
    license: Apache-2.0
    url: "https://huggingface.co/Qwen/Qwen3.8-27B"
    hardware: { footprint: "14.5 GB (IQ4_XS · Zone 1 16GB VRAM)" }
    capabilities: [coding, research, reverse-eng, social, unfiltered]
    edges:
      runs_on: [16vram-64ram, mac-apple-silicon]
    proof:
      - "Top 16GB VRAM dense coding & strict-instruction backbone (73.0 Terminal-Bench, 94.9 SWE-Pro Unsloth)"
      - "Single frozen backbone hosting both HF Harness RL Adapters and Securelayer7 26 MB uncensored LoRA"
    launch_recipe: "llama-server -m Qwen3.8-27B-IQ4_XS.gguf -ngl 99 -fa on -c 32768 -ctk q8_0 -ctv q8_0"
    gotchas:
      - "Use IQ4_XS + Q8 KV cache on 16GB VRAM so weights never spill across PCIe."

  - id: qwen3-coder-next
    kind: model
    name: "Qwen3-Coder-Next (80B-A3B Sparse MoE)"
    lifecycle: mature
    decay_class: stable
    last_verified: "2026-11-27"
    license: Apache-2.0
    url: "https://huggingface.co/unsloth/Qwen3-Coder-Next-GGUF"
    hardware: { footprint: "49 GB (UD-Q4_K_XL · Zone 2 16GB+64GB Hybrid)" }
    capabilities: [coding, reverse-eng, game-dev]
    edges:
      runs_on: [16vram-64ram, mac-apple-silicon]
    proof:
      - "512-expert sparse MoE activating 3B params/token; battle-tested daily driver in llama.cpp & ik_llama.cpp"
    launch_recipe: "GGML_CUDA_GRAPH_OPT=1 llama-server -m Qwen3-Coder-Next-UD-Q4_K_XL.gguf -ngl 99 -fa on -c 120000 --load-mode none --n-cpu-moe 29 -ctk q8_0 -ctv q8_0 --temp 0"
    gotchas:
      - "Never lower -ngl on MoEs; keep Attention/KV on GPU and sweep --n-cpu-moe."

  - id: gemma-4
    kind: model
    name: "Gemma 4 Family (26B-A4B Vision & 12B Tri-Modal)"
    lifecycle: mature
    decay_class: stable
    last_verified: "2026-11-27"
    license: Apache-2.0
    url: "https://ai.google.dev/gemma"
    hardware: { footprint: "8.5-14 GB (Zone 1 16GB VRAM)" }
    capabilities: [coding, research]
    edges:
      runs_on: [16vram-64ram, mac-apple-silicon]
    proof:
      - "26B-A4B runs ~140 tok/s 100% resident in 16GB VRAM; 12B adds native local audio input"
    gotchas:
      - "Gemma 4 Audio Trap: only E2B/E4B/12B process audio; 26B-A4B is Text + Vision only."

  - id: hermes-4
    kind: model
    name: "NousResearch Hermes 4 (14B / 4.3-36B Neutral)"
    lifecycle: mature
    decay_class: stable
    last_verified: "2026-11-27"
    license: Apache-2.0
    url: "https://huggingface.co/NousResearch/Hermes-4-14B"
    hardware: { footprint: "9 GB (14B) / 22 GB (36B Hybrid)" }
    capabilities: [unfiltered]
    edges:
      runs_on: [16vram-64ram, mac-apple-silicon]
    proof:
      - "Tops RefusalBench via neutral alignment: uncensored by default while obeying operator system-prompt policies"
    launch_recipe: "llama-server -m Hermes-4-14B-Q4_K_M.gguf -ngl 99 -fa on -c 32768"
    gotchas:
      - "Author explicit operator rules in the system prompt if deploying beyond solo use."

  - id: inkling-2-mini
    kind: model
    name: "Inkling 2 Mini (26.4B Looped Transformer MoE)"
    lifecycle: experimental
    decay_class: operational
    last_verified: "2026-11-27"
    license: "Apache-2.0 + AUP"
    url: "https://huggingface.co/unsloth/Inkling-2-Mini-GGUF"
    hardware: { footprint: "13-18 GB (UD-Q3/Q4 + DSpark · Zone 1/2)" }
    capabilities: [coding, game-dev]
    edges:
      runs_on: [16vram-64ram, mac-apple-silicon]
    proof:
      - "Middle 12 of 24 layers loop 3x (3.4B base / 5.4B eff. active, 1M ctx); 79.2% SWE-bench Verified, 48.2% DeepSWE v1.1"
      - "Mainline llama.cpp (#32218, Nov 23) now supports looped layers & DSpark natively alongside Unsloth"
    launch_recipe: "llama-server -hf unsloth/Inkling-2-Mini-GGUF:UD-Q4_K_M"
    gotchas:
      - "Trails Qwen3.8-27B on strict chat (50% MultiChallenge); cap turns/tokens to avoid repetitive debug loops and sandbox file edits."

  - id: laya-05
    kind: model
    domain: local-decision
    name: "Laya 0.5 (Multimodal System-1 Decision Model)"
    lifecycle: mature
    decay_class: stable
    last_verified: "2026-11-27"
    license: Apache-2.0
    url: "https://github.com/NandhaKishorM/laya"
    hardware: { footprint: "678-846 MB (CPU / NPU / WebGPU)" }
    capabilities: [decisions, safety]
    edges:
      runs_on: [16vram-64ram, mac-apple-silicon]
      guards: ["*"]
    proof:
      - "Evaluates 64 typed decisions per pass in <100-500ms; v0.5 reads text, images, audio & video up to 73,728 tokens"
      - "Installs cleanly via pip install -U laya; serves via Unsloth Decision API (localhost:8888)"
    launch_recipe: "unsloth serve-decision convaiinnovations/laya-typed-decisions --port 8888"
    gotchas:
      - "Threshold on probabilities (not confidence); vegaml-learn continuous learning add-on is non-commercial."

  - id: qwen-image-2.1
    kind: model
    domain: multimodal
    name: "Qwen-Image-2.1 (7B DiT Native RGBA)"
    lifecycle: mature
    decay_class: stable
    last_verified: "2026-11-27"
    license: "Qwen Research (Non-Commercial)"
    url: "https://huggingface.co/Qwen/Qwen-Image-2.1"
    hardware: { footprint: "9.1 GB VRAM (Q4_K_M)" }
    capabilities: [media]
    edges:
      runs_on: [16vram-64ram, mac-apple-silicon]
    proof:
      - "#1 VDEBench; native RGBA layer output and 2048px typography inside 16GB VRAM"
    gotchas:
      - "Non-commercial Qwen Research license; use FLUX.2 Klein (Apache-2.0) for commercial graphics."

  - id: wan-2.2
    kind: model
    domain: multimodal
    name: "Wan 2.2 (5B & A14B Open Video)"
    lifecycle: mature
    decay_class: stable
    last_verified: "2026-11-27"
    license: Apache-2.0
    url: "https://huggingface.co/Wan-AI/Wan2.2-TI2V-5B"
    hardware: { footprint: "6-15 GB VRAM via WanGP MMGP v4" }
    capabilities: [media]
    edges:
      runs_on: [16vram-64ram]
    proof:
      - "Top permissive Apache-2.0 local video checkpoint accelerated by WanGP v20.12"
    gotchas:
      - "Wan 3.0 and Wan 2.6 remain closed APIs with no published weights."
