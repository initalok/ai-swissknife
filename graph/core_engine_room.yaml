nodes:
  # --- HARNESSES BY ARCHITECTURAL ROLE ---
  - id: pi
    kind: harness
    role: "Building-Block Kernel"
    name: "Pi Coding Agent (+ @earendil-works/pi-durable)"
    lifecycle: mature
    decay_class: stable
    last_verified: "2026-11-27"
    license: MIT
    url: "https://github.com/earendil-works/pi"
    capabilities: [coding, research, reverse-eng, game-dev, media, social, unfiltered]
    edges:
      runs_on: [zero-card-cloud, 16vram-64ram, mac-apple-silicon]
    proof:
      - "Minimal hackable TUI/RPC/SDK loop with /tree DAG branching, MCP + Codemode JS sandbox, and first-party pi-durable SQLite checkpoints"
      - "Highest-scoring HF Harness Adapter target (64.7% SWE-Pro hard-51) and Inkling 2 Mini reference harness"
    gotchas:
      - "Intentionally omits built-in per-tool approval prompts; pair with safeagents or OS sandboxes."

  - id: deepseek-harness
    kind: harness
    role: "Cordis Plugin Platform"
    name: "DeepSeek Harness (dsh)"
    lifecycle: experimental
    decay_class: volatile
    last_verified: "2026-11-27"
    license: MIT
    url: "https://github.com/deepseek-ai/deepseek-harness"
    capabilities: [coding, media]
    edges:
      runs_on: [zero-card-cloud, 16vram-64ram, mac-apple-silicon]
    proof:
      - "Cordis everything-is-a-plugin architecture letting you swap the agent loop itself, Creator Mode, & built-in read-only sandbox"
      - "First-party plugins orchestrate Claude Code & Codex as sub-agents; supports local OpenAI-compat servers"
    launch_recipe: "npx @deepseek-ai/dsh web"
    gotchas:
      - "Fast-moving developer preview (0.2.3-alpha.2); pin plugin versions against breaking API changes."

  - id: hermes-agent
    kind: harness
    role: "Self-Improving Daemon"
    name: "Hermes Agent (v0.23.4)"
    lifecycle: operational
    decay_class: operational
    last_verified: "2026-11-27"
    license: MIT
    url: "https://github.com/NousResearch/hermes-agent"
    capabilities: [coding, research, social]
    edges:
      runs_on: [zero-card-cloud, 16vram-64ram, mac-apple-silicon]
    proof:
      - "#1 globally on OpenRouter token volume; persistent memory, autonomous skill creation, Telegram/cron/ACP, 40+ tools"
      - "Official HF Harness Adapter target (Qwen3.8-27B-hermes-adapted)"
    gotchas:
      - "Does not auto-compact aggressively like Pi by default; cap thinking/context tokens on giant repos."

  - id: opencode
    kind: harness
    role: "Vendor-Agnostic Terminal CLI"
    name: "OpenCode CLI"
    lifecycle: mature
    decay_class: stable
    last_verified: "2026-11-27"
    license: MIT
    url: "https://github.com/anomalyco/opencode"
    capabilities: [coding, unfiltered]
    edges:
      runs_on: [zero-card-cloud, 16vram-64ram, mac-apple-silicon]
    proof:
      - "Clean terminal coding agent with official HF Qwen3.8-27B-opencode-adapted LoRA"
    gotchas:
      - "Watch context length on multi-hour repos; does not auto-compact as aggressively as Pi."

  # --- RUNTIME SAFETY PROXY ---
  - id: safeagents
    kind: tool
    name: "Hugging Face safeagents Runtime Proxy"
    lifecycle: operational
    decay_class: operational
    last_verified: "2026-11-27"
    license: Apache-2.0
    url: "https://github.com/huggingface/safeagents"
    capabilities: [safety]
    edges:
      guards: ["*"]
    proof:
      - "Transparent OpenAI/Anthropic proxy with atif-scan (10-20ms on Apple Silicon) & optional Decision Model judge"
      - "Audited 1.3M RL tool calls and blocked 647 suspicious calls during HF harness-adapter training"
    launch_recipe: "safeagents start http://localhost:8000 --plugin hf://harness-hub/qwen-safeagents-plugin"
    gotchas:
      - "Configure a domain plugin (e.g. hf://harness-hub/qwen-safeagents-plugin) rather than running empty defaults."

  # --- HARNESS ADAPTERS & IN-HARNESS RL LAB DOSSIER ---
  - id: qwen38-super-adapter
    kind: adapter
    name: "Qwen3.8-27B Rank-96 Super-Adapter (HF Harness Hub)"
    lifecycle: mature
    decay_class: stable
    last_verified: "2026-11-27"
    license: Apache-2.0
    url: "https://huggingface.co/harness-hub/Qwen3.8-27B-super-adapter"
    capabilities: [coding, reverse-eng]
    edges:
      adapts: [qwen3.8-27b, pi, hermes-agent, opencode]
      runs_on: [16vram-64ram, mac-apple-silicon]
    proof:
      - "Zero-retraining orthogonal rank-96 merge (PEFT cat, wt 0.5) of pi, Hermes, & OpenCode RL LoRAs (cosine sim 0.01-0.02)"
      - "GGUF LoRA adds only +912 MiB (+304 MiB for single-harness specialist) on top of frozen Qwen3.8-27B"
    eval_tables:
      - title: "HF Harness Adapters Summary: Base vs. Specialist vs. Rank-96 Super-Adapter (Qwen3.8-27B)"
        headers: ["Mode / Benchmark", "Base Qwen3.8-27B", "Best Specialist LoRA", "Rank-96 Super-Adapter", "Tool-Call Reduction"]
        rows:
          - ["Thinking Off · Mean across 6 pairs", "39.5%", "pi SWE-Pro: 64.7% (vs 39.2%)", "49.0% (beats base 6/6)", "-53% to -73% calls"]
          - ["Thinking On (xhigh) · Mean across 6 pairs", "55.5%", "Trained w/ thinking off", "63.5% (wins 5/6, ties 1)", "-31% to -48% SWE-Pro"]
          - ["Cross-Harness Transfer (pi LoRA -> others)", "44.8% OC / 46.3% Hermes", "54.0% OC / 56.1% Hermes", "Transfers to Swift-1.5 too", "~45% fewer calls"]
    launch_recipe: "llama-server -m Qwen3.8-27B-IQ4_XS.gguf --lora Qwen3.8-27B-super-adapter-F16.gguf -ngl 99 -fa on -c 65536 -ctk q8_0 -ctv q8_0"
    gotchas:
      - "Decision rule: single harness + thinking off -> use specialist LoRA; thinking on or multi-harness -> use super-adapter."
      - "Trained on BF16; verify GGUF quant fidelity and expect mild pre-tool reasoning leakage (arXiv:2610.14270)."

  - id: qwen38-abliterated-lora
    kind: adapter
    name: "Qwen3.8-27B 26MB Uncensored LoRA (Rank-3)"
    lifecycle: operational
    decay_class: operational
    last_verified: "2026-11-27"
    license: Apache-2.0
    url: "https://huggingface.co/Securelayer7/Qwen3.8-27B-Uncensored-Abliterated"
    capabilities: [unfiltered]
    edges:
      adapts: [qwen3.8-27b]
      runs_on: [16vram-64ram, mac-apple-silicon]
    proof:
      - "Tiny 26 MB rank-3 LoRA (built on Apple Silicon) hot-swapping over the exact same frozen Qwen3.8-27B backbone"
    gotchas:
      - "Abliterated adapters cannot refuse harmful tool actions; always isolate behind safeagents + Laya 0.5."

  - id: hf-in-harness-rl
    kind: tool
    domain: adaptation
    name: "HF In-Harness RL Recipe (OpenEnv + Harbor + TRL AsyncGRPO)"
    lifecycle: operational
    decay_class: operational
    last_verified: "2026-11-27"
    license: Apache-2.0
    url: "https://huggingface.co/blog/harness-adapters-at-scale"
    capabilities: [adaptation]
    proof:
      - "Trains LoRAs directly inside unmodified shipping harnesses via token/logprob capture proxy (echoing Agent Lightning v1.0)"
      - "openenv validate passed 858/1,127 tasks; base-model difficulty filtering drove the largest GRPO reward lift"
    eval_tables:
      - title: "TB2.1 Lift Experiment (Qwen3.8-27B · LoRA AsyncGRPO · 32 tasks/arm · 8xH200 · Base TB2.1 pass@1: 35.9%)"
        headers: ["Arm", "Task Filtering Rule", "Steps Reached", "Train Reward (Steps 1-5 -> Last 5)"]
        rows:
          - ["A1 Unvalidated", "24 accepted + 8 failed validation", "40 (timed out step 48)", "0.64 -> 0.67"]
          - ["A2 Validated", "32 accepted, no difficulty filter", "50 (completed)", "0.56 -> 0.70"]
          - ["A3 Unqualified", "32 accepted base always/never solves", "25 (timed out step 26)", "0.60 -> 0.63"]
          - ["A4 Qualified", "32 accepted base solves sometimes", "50 (completed)", "0.62 -> 0.81"]
    gotchas:
      - "Use all-linear LoRA, LR 2e-5 (1e-4 collapses rollouts), tool bonus 0.1, & never train GRPO on all-pass/all-fail tasks."

  # --- INFERENCE & MEDIA BACKENDS ---
  - id: llama-cpp
    kind: backend
    name: "llama.cpp (Mainline GGUF + Looped Layers)"
    lifecycle: mature
    decay_class: stable
    last_verified: "2026-11-27"
    license: MIT
    url: "https://github.com/ggml-org/llama.cpp"
    capabilities: [coding]
    edges:
      runs_on: [16vram-64ram, mac-apple-silicon]
    proof:
      - "Universal CUDA/Metal/Vulkan/ROCm engine with --n-cpu-moe offload, --lora hot-loading, --load-mode, & PR #32218 Inkling looped support"
    gotchas:
      - "--no-mmap is deprecated (use --load-mode none); add -cuda graphs=0 if partial MoE offload outputs gibberish."

  - id: unsloth-runtime
    kind: backend
    name: "Unsloth Runtime & Studio"
    lifecycle: operational
    decay_class: operational
    last_verified: "2026-11-27"
    license: Apache-2.0
    url: "https://github.com/unslothai/unsloth"
    capabilities: [coding, decisions]
    edges:
      runs_on: [16vram-64ram, mac-apple-silicon]
    proof:
      - "3x faster VRAM-exceeding MoE GGUFs, Anthropic-compatible local API for Claude Code, Decision API, & Bwrap/Seatbelt/MXC sandboxes"
    gotchas:
      - "Keep Studio updated alongside mainline llama.cpp for newest Dynamic v3.1 quant support."

  - id: mlx-lm
    kind: backend
    name: "Apple MLX (mlx-lm)"
    lifecycle: mature
    decay_class: stable
    last_verified: "2026-11-27"
    license: MIT
    url: "https://github.com/ml-explore/mlx-lm"
    capabilities: [coding]
    edges:
      runs_on: [mac-apple-silicon]
    proof:
      - "Zero PCIe copy bottleneck on Mac mini/Studio unified memory (~65 tok/s on 4-bit Qwen3.8-27B super-adapter)"
    gotchas:
      - "Prompt prefill lags dedicated NVIDIA Tensor Cores; 32GB+ unified memory recommended for 27B MLX."

  - id: wangp
    kind: backend
    name: "WanGP v20.12 (MMGP v4 + SageGP 1.0.2)"
    lifecycle: operational
    decay_class: volatile
    last_verified: "2026-11-27"
    license: Apache-2.0
    url: "https://github.com/deepbeepmeep/WanGP"
    capabilities: [media]
    edges:
      runs_on: [16vram-64ram]
    proof:
      - "Extreme Chunker fits 15s of 1080p Hailuo H3 video into 5.9 GB VRAM; runs Wan 2.2, LTX-2.5, Qwen-Image-2.1, & native MCP"
    gotchas:
      - "Install WGPKernels 1.5.0 & SageGP 1.0.2 (PyTorch 2.10; Triton 3.6+ for RTX 50xx adaptive Sage2/3)."
