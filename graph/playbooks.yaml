playbooks:
  - id: coding-and-apps
    title: "Coding, Web & Mobile Apps"
    verdict: "Pair your profile's best coding brain and harness (with auto-discovered HF LoRA adapters) against live Context7 docs, Playwright browser QA, and Sentry MobileBuildMCP."
    last_verified: "2026-11-27"
    decay_class: operational
    constraints:
      capabilities: [coding]
      privacy: any
      require_guard: true
    domain_tools:
      - { id: playwright-mcp, name: "Microsoft Playwright MCP", url: "https://github.com/microsoft/playwright-mcp" }
      - { id: context7, name: "Upstash Context7 (ctx7 + @upstash/context7-pi)", url: "https://github.com/upstash/context7" }
      - { id: mobile-build-mcp, name: "Sentry MobileBuildMCP (Apple Builds/XCTest/LLDB)", url: "https://github.com/getsentry/MobileBuildMCP" }
      - { id: superpowers, name: "obra/superpowers (15 TDD & Spec Skills)", url: "https://github.com/obra/superpowers" }
    workflow:
      - "Pin live framework doc lookups via Context7 (ctx7 or @upstash/context7-pi) inside repo AGENTS.md."
      - "Use obra/superpowers to enforce Spec -> Red/Green TDD -> Verification before multi-file edits."
      - "Verify web UI flows via Playwright MCP and Apple targets/simulators via Sentry MobileBuildMCP."
    gotchas:
      - "Pin local Context7 >= 2.1.3 (CVE-2026-75130); Playwright accessibility snapshots cannot pierce closed Shadow DOM."
      - "MobileBuildMCP covers Apple builds/simulators; pair with USB device tooling for physical Android/iPhone UI taps."

  - id: research-and-grounding
    title: "Deep Research & Cited Literature Synthesis"
    verdict: "Combine GPT Researcher with card-free Exa 3.0, Firecrawl, Jina, and keyless OpenAlex (100K/day) for high-precision cited synthesis."
    last_verified: "2026-11-27"
    decay_class: operational
    constraints:
      capabilities: [research]
      privacy: any
      require_guard: false
    domain_tools:
      - { id: gpt-researcher, name: "GPT Researcher (gptr-mcp & Skill)", url: "https://github.com/assafelovic/gpt-researcher" }
      - { id: openalex, name: "OpenAlex Polite Pool (100K/day Keyless)", url: "https://openalex.org/" }
      - { id: exa, name: "Exa 3.0 Neural Search ($10/mo Free)", url: "https://exa.ai/" }
      - { id: firecrawl, name: "Firecrawl Keyless Scraper", url: "https://www.firecrawl.dev/" }
    workflow:
      - "Pull open-access papers and citation graphs via OpenAlex (?mailto=...) and semantic discovery via Exa 3.0."
      - "Run GPT Researcher across web sources and local PDF/CSV folders for cited draft reports."
      - "Verify primary DOIs, dates, and exact numbers before treating any report as publication-ready."
    gotchas:
      - "Never cite autonomous research summaries without verifying primary source URLs."

  - id: local-media-studio
    title: "Local Media Studio (Video, Image, Motion & Voice)"
    verdict: "Anchor local 16GB video and RGBA image pipelines in WanGP v20.12 + Wan 2.2 / Qwen-Image-2.1, paired with Hyperframes for code-driven MP4s."
    last_verified: "2026-11-27"
    decay_class: operational
    constraints:
      capabilities: [media]
      privacy: any
      require_guard: false
    pin_nodes: [wangp, qwen-image-2.1, wan-2.2]
    domain_tools:
      - { id: hyperframes, name: "HeyGen Hyperframes (HTML-to-MP4 Studio)", url: "https://github.com/heygen-com/hyperframes" }
      - { id: davinci-mcp-free, name: "DaVinci Resolve MCP (Free & Studio Bridge)", url: "https://github.com/hiteshK03/davinci-resolve-mcp" }
      - { id: phonon-31m, name: "Gradium Phonon 31M WebGPU TTS (4.9ms)", url: "https://github.com/blixt/phonon" }
    workflow:
      - "Use Hyperframes for crisp programmatic product demos, UI animations, and launch graphics."
      - "Generate consistent AI video clips inside 5.9-15 GB VRAM via WanGP v20.12 (Extreme Chunker + MMGP v4)."
      - "Assemble final edits in DaVinci Resolve via MCP and synthesize fast English voiceovers via Phonon 31M."
    gotchas:
      - "Qwen-Image-2.1 is non-commercial (Qwen Research); swap to FLUX.2 Klein (Apache-2.0) for commercial graphics."
