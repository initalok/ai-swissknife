name: PR & Branch Book Lint + Drift Gate
on:
  push:
    branches: [main, v2-beta]
  pull_request:
    branches: [main, v2-beta]

jobs:
  lint-and-verify-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/build.py all
      - name: Fail if compiled docs drifted from data/*.yaml
        run: git diff --exit-code README.md book/ llms.txt llms-full.txt
