name: Weekly Upstream Sync, Book Lint & Compile
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sync-lint-compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/build.py all --sync
      - name: Commit updated upstream state & compiled Field Book
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add upstream/sources.json upstream/latest_diff_report.md README.md book/ llms.txt llms-full.txt
          git diff --staged --quiet || git commit -m "chore(upstream): weekly sync, graveyard filter, and book compile"
          git push
