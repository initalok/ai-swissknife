name: Upstream Watch & Spatial Canvas Render

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:      # Manual trigger

permissions:
  contents: write

jobs:
  watch-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Spatial Pipeline (Ingest -> Lint -> Render)
        run: |
          python ask.py all

      - name: Commit & push if diff detected
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add upstream/sources.json upstream/latest_diff_report.md poster.svg index.html README.md
          if git diff --staged --quiet; then
            echo "No upstream changes or render diffs to commit."
          else
            git commit -m "chore(upstream): auto-sync upstream diffs & re-render spatial canvas"
            git push
          fi
