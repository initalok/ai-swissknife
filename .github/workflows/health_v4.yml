name: Rolling Multi-Source Health Probe & Single Digest Issue
on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

jobs:
  rolling-health:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Probe 20 oldest canonical URLs (GitHub + HF + HTTP) & recompile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/cli.py health --probe 20 > /dev/null
          python scripts/cli.py build
          python scripts/cli.py digest > /tmp/health_digest.md
      - name: Commit updated health/state.json & compiled freshness views
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add health/state.json README.md book/ llms.txt llms-full.txt dist/graph.json
          git diff --staged --quiet || git commit -m "chore(health): rolling LRU probe & freshness recompile"
          git push
      - name: Update single rolling Health Digest issue (zero spam)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUM=$(gh issue list --label "health-digest" --state open --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file /tmp/health_digest.md
          else
            gh label create "health-digest" --color "FBCA04" --force
            gh issue create --title "[Health Digest] AI Swiss Knife Live Freshness & Graveyard Radar" --label "health-digest" --body-file /tmp/health_digest.md
          fi
