name: Rolling Liveness & Upstream Momentum Watcher
on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

permissions: {}

concurrency:
  group: health-momentum-watcher
  cancel-in-progress: false

jobs:
  rolling-probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"
      - run: python -m pip install -e .
      - name: Probe 20 oldest targets (GitHub Releases + HF + HTTP) & sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          swissknife probe --limit 20 > /dev/null
          swissknife sync
          swissknife digest > /tmp/health_digest.md
      - name: Commit updated telemetry, deltas & refreshed managed blocks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add health/state.json health/deltas.json README.md STATUS.md docs/ worlds/ guides/ reference/ research/ llms.txt llms-full.txt dist/catalog.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(health): rolling probe, release deltas, and managed-block sync"
            git -c credential.helper='!f() { echo "username=x-access-token"; echo "password=${GH_TOKEN}"; }; f' push
          fi
      - name: Update single rolling Health & Momentum Digest issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUM=$(gh issue list --label "health-digest" --state open --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body-file /tmp/health_digest.md
          else
            gh label create "health-digest" --color "FBCA04" --force
            gh issue create --title "[Health Digest] AI Swiss Knife Live Liveness & Release Momentum" --label "health-digest" --body-file /tmp/health_digest.md
          fi
