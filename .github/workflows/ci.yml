name: Test, Validate & Managed-Block Drift Gate
on:
  push:
    branches: [main, "v6*"]
  pull_request:
    branches: [main, "v6*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python -m unittest discover -s tests -t . -v
      - run: swissknife validate
      - run: swissknife sync
      - name: Fail if managed blocks or generated views drifted
        run: git diff --exit-code README.md STATUS.md docs/ worlds/ guides/ reference/ research/ llms.txt llms-full.txt dist/catalog.json health/deltas.json
