name: Test, Validate & Managed-Block Drift Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"
      - name: Install package & quality tools
        run: |
          python -m pip install -e . ruff zizmor
      - name: Lint Python kernel & tests (ruff)
        run: ruff check src tests
      - name: Audit GitHub Actions workflows (zizmor)
        run: zizmor --no-online-audits .github/workflows/
      - name: Run unit & surface tests
        run: python -m unittest discover -s tests -t . -v
      - name: Validate catalog & sync managed blocks
        run: |
          swissknife validate
          swissknife sync
      - name: Fail if managed blocks or generated views drifted
        run: git diff --exit-code README.md STATUS.md docs/ worlds/ guides/ reference/ research/ llms.txt llms-full.txt dist/catalog.json health/deltas.json
