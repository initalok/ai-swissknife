name: Propose a Tool, Model, or Guide Addition
description: Propose an addition backed by a canonical URL, evidence tier, and explicit limitations.
labels: ["proposal"]
body:
  - type: input
    id: url
    attributes:
      label: Canonical GitHub, Hugging Face, or Official Docs URL
      placeholder: "https://github.com/org/repo"
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Evidence Tier
      options:
        - primary-eval (independent or reproduced evaluation)
        - official-docs (primary documentation or release notes)
        - vendor-claim (lab-reported metric)
        - field-note (reproducible community workflow)
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Explicit Limitations / When NOT to use it
      placeholder: "Every entry must state real-world boundary conditions."
    validations:
      required: true
