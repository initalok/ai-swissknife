name: Report Outdated Info or Broken Link
description: Flag a free-tier change, archived repository, or superseded recommendation.
labels: ["stale-report"]
body:
  - type: input
    id: entry
    attributes:
      label: Affected page, slot, or entry
      placeholder: "e.g., worlds/cloud.md — Google AI Studio"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: What changed? (Include canonical primary source URL)
      placeholder: "Link to official docs, release notes, or issue proving the change."
    validations:
      required: true
