name: Add Verified AI Resource
description: Propose a new Cloud API, Local 16GB+64GB Model, Harness, or RL Recipe
labels: ["enhancement", "curation"]
body:
  - type: dropdown
    id: chapter
    attributes:
      label: Target Book Chapter
      options:
        - "Ch 01 · Cloud APIs & Grounding"
        - "Ch 02 · Local AI (16GB VRAM + 64GB RAM)"
        - "Ch 03 · Multimodal & World Models"
        - "Ch 04 · Harnesses, Protocols & Safety"
        - "Ch 05 · Backends, Flags & Silicon"
        - "Ch 06 · Adaptation, RL & Frontier"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Primary Source URL
      placeholder: "Official docs, Hugging Face model card, GitHub release, or arXiv link"
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Benchmark / Quota / Hardware Footprint Proof
    validations:
      required: true
  - type: textarea
    id: gotcha
    attributes:
      label: Real-World Gotcha (Required by Design System)
      placeholder: "Rate limit trap, license nuance, VRAM margin, or compatibility catch"
    validations:
      required: true
